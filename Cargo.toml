[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Reeperk/PHPForge"
rust-version = "1.80"

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
forge-plugin-api = { path = "crates/forge-plugin-api" }
forge-ai = { path = "crates/forge-ai" }
forge-agent-cli = { path = "crates/forge-agent-cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
dirs = "6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
