goforge-pprof = { path = "packs/goforge/pprof" }
goforge-delve = { path = "packs/goforge/delve" }
goforge-sdk = { path = "packs/goforge/sdk" }
rustforge-lang-rust = { path = "packs/rustforge/lang-rust" }
rustforge-toolchain = { path = "packs/rustforge/toolchain" }
rubyforge-lang-ruby = { path = "packs/rubyforge/lang-ruby" }
rubyforge-sdk = { path = "packs/rubyforge/sdk" }
rubyforge-fw-rails = { path = "packs/rubyforge/fw-rails" }
dotnetforge-lang-dotnet = { path = "packs/dotnetforge/lang-dotnet" }
dotnetforge-sdk = { path = "packs/dotnetforge/sdk" }
pyforge-testing = { path = "packs/pyforge/testing" }
pyforge-frameworks = { path = "packs/pyforge/frameworks" }
pyforge-jupyter = { path = "packs/pyforge/jupyter" }
javaforge-build = { path = "packs/javaforge/build" }
javaforge-lang-java = { path = "packs/javaforge/lang-java", default-features = false }
javaforge-jdk = { path = "packs/javaforge/jdk" }
javaforge-fw-spring = { path = "packs/javaforge/fw-spring" }
javaforge-lang-groovy = { path = "packs/javaforge/lang-groovy" }
javaforge-lang-scala = { path = "packs/javaforge/lang-scala" }
javaforge-android = { path = "packs/javaforge/android" }
kotlinforge-lang-kotlin = { path = "packs/kotlinforge/lang-kotlin" }
cforge-toolchains = { path = "packs/cforge/toolchains" }
cforge-cmake = { path = "packs/cforge/cmake" }
cforge-lang-cpp = { path = "packs/cforge/lang-cpp" }
cforge-analyzers = { path = "packs/cforge/analyzers" }
cforge-embedded = { path = "packs/cforge/embedded" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
dirs = "6"
tempfile = "3"
ignore = "0.4"

# Line tables keep panics and backtraces readable at a fraction of full debug info's size.
# Everyone (make dev, tests, agents) builds the same profile, so target/ holds one copy.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Size-optimised build of crates/forge-wasm for browser mode (`pnpm --dir app/ui wasm`).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"

# Indexing is CPU heavy: keep the search crate and its hot dependencies optimized in dev builds.
[profile.dev.package.forge-search-core]
opt-level = 3
[profile.dev.package.forge-search]
opt-level = 3
[profile.dev.package.roaring]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.ignore]
opt-level = 3
[profile.dev.package.globset]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
[profile.dev.package.crossbeam-deque]
opt-level = 3
[profile.dev.package.crossbeam-epoch]
opt-level = 3
[profile.dev.package.nucleo-matcher]
opt-level = 3
[profile.dev.package.bincode]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3

# Building the dictionary and ranking suggestions are hot loops: keep them fast in dev builds.
[profile.dev.package.forge-spell]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
