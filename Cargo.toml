[workspace]
resolver = "2"
members = ["crates/*", "packs/phpforge/lang-php", "packs/phpforge/fw-laravel", "packs/phpforge/fw-symfony", "packs/phpforge/orm-doctrine", "packs/phpforge/dql", "packs/phpforge/composer", "packs/phpforge/interpreters", "packs/phpforge/cli-tools", "packs/phpforge/test-frameworks", "packs/webforge/lang-web", "packs/webforge/fw-react", "packs/webforge/fw-vue", "packs/webforge/fw-angular", "packs/luaforge/lang-lua", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Reeperk/Forge"
rust-version = "1.80"

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
forge-trust = { path = "crates/forge-trust" }
forge-wasm = { path = "crates/forge-wasm" }
forge-fuzzy = { path = "crates/forge-fuzzy" }
forge-find = { path = "crates/forge-find" }
forge-scopes = { path = "crates/forge-scopes" }
forge-ssr = { path = "crates/forge-ssr" }
forge-search = { path = "crates/forge-search" }
forge-search-core = { path = "crates/forge-search-core" }
forge-bookmarks = { path = "crates/forge-bookmarks" }
forge-localhistory = { path = "crates/forge-localhistory", default-features = false }
forge-text = { path = "crates/forge-text" }
forge-codestyle = { path = "crates/forge-codestyle" }
forge-save-actions = { path = "crates/forge-save-actions", default-features = false }
forge-editing = { path = "crates/forge-editing" }
forge-file-templates = { path = "crates/forge-file-templates" }
forge-codeintel = { path = "crates/forge-codeintel" }
forge-filetypes = { path = "crates/forge-filetypes" }
forge-maintenance = { path = "crates/forge-maintenance", default-features = false }
forge-plugin-api = { path = "crates/forge-plugin-api" }
forge-ai = { path = "crates/forge-ai" }
forge-agent-cli = { path = "crates/forge-agent-cli" }
forge-lsp = { path = "crates/forge-lsp" }
forge-langservers = { path = "crates/forge-langservers" }
forge-vcs = { path = "crates/forge-vcs" }
forge-diff = { path = "crates/forge-diff" }
forge-project = { path = "crates/forge-project" }
forge-open = { path = "crates/forge-open" }
forge-process = { path = "crates/forge-process" }
forge-output = { path = "crates/forge-output" }
forge-runtools = { path = "crates/forge-runtools" }
forge-markdown = { path = "crates/forge-markdown" }
forge-viewers = { path = "crates/forge-viewers" }
forge-debug = { path = "crates/forge-debug" }
forge-db = { path = "crates/forge-db" }
forge-containers = { path = "crates/forge-containers" }
forge-sql = { path = "crates/forge-sql" }
forge-forges = { path = "crates/forge-forges" }
forge-keymap = { path = "crates/forge-keymap" }
forge-vim = { path = "crates/forge-vim" }
forge-livetemplates = { path = "crates/forge-livetemplates" }
forge-injections = { path = "crates/forge-injections" }
forge-emmet = { path = "crates/forge-emmet" }
forge-colors = { path = "crates/forge-colors" }
forge-spell = { path = "crates/forge-spell" }
forge-jsonschema = { path = "crates/forge-jsonschema" }
forge-scratches = { path = "crates/forge-scratches", default-features = false }
forge-backend = { path = "crates/forge-backend", default-features = false }
forge-remote = { path = "crates/forge-remote" }
forge-window = { path = "crates/forge-window" }
forge-update = { path = "crates/forge-update" }
phpforge-composer = { path = "packs/phpforge/composer" }
phpforge-interpreters = { path = "packs/phpforge/interpreters" }
phpforge-cli-tools = { path = "packs/phpforge/cli-tools" }
phpforge-test-frameworks = { path = "packs/phpforge/test-frameworks" }
luaforge-lang-lua = { path = "packs/luaforge/lang-lua" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
dirs = "6"
tempfile = "3"
ignore = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Size-optimised build of crates/forge-wasm for browser mode (`pnpm --dir app/ui wasm`).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"

# Indexing is CPU heavy: keep the search crate and its hot dependencies optimized in dev builds.
[profile.dev.package.forge-search-core]
opt-level = 3
[profile.dev.package.forge-search]
opt-level = 3
[profile.dev.package.roaring]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.ignore]
opt-level = 3
[profile.dev.package.globset]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
[profile.dev.package.crossbeam-deque]
opt-level = 3
[profile.dev.package.crossbeam-epoch]
opt-level = 3
[profile.dev.package.nucleo-matcher]
opt-level = 3
[profile.dev.package.bincode]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3

# Building the dictionary and ranking suggestions are hot loops: keep them fast in dev builds.
[profile.dev.package.forge-spell]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
