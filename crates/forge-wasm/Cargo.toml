[package]
name = "forge-wasm"
description = "WebAssembly build of Forge's pure Rust logic for the browser-mode UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
forge-output.workspace = true
forge-sql.workspace = true
forge-markdown.workspace = true
forge-agent-cli = { path = "../forge-agent-cli", default-features = false }
phpforge-dql = { path = "../../packs/phpforge/dql" }
forge-keymap.workspace = true
wasm-bindgen = "=0.2.129"
forge-fuzzy.workspace = true
forge-filetypes.workspace = true
forge-plugin-api.workspace = true
forge-scratches.workspace = true
forge-containers = { path = "../forge-containers", default-features = false }
forge-remote = { path = "../forge-remote", default-features = false }
webforge-lang-web = { path = "../../packs/webforge/lang-web", default-features = false }
webforge-fw-react = { path = "../../packs/webforge/fw-react" }
webforge-fw-vue = { path = "../../packs/webforge/fw-vue" }
webforge-fw-angular = { path = "../../packs/webforge/fw-angular" }
