[package]
name = "forge-wasm"
description = "WebAssembly build of Forge's pure Rust logic for the browser-mode UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
