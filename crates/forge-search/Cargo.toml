[package]
name = "forge-search"
description = "Forge code search: persistent trigram index, find in files, fuzzy file names"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-core.workspace = true
forge-find.workspace = true
forge-fuzzy.workspace = true
forge-search-core = { workspace = true, features = ["parallel"] }
tracing.workspace = true
ignore = "0.4"
rayon = "1"
regex = "1"
dirs.workspace = true
notify = "8"
thread-priority = "3.1.1"
tree-sitter = "0.25"
tree-sitter-php = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-lua = "0.2"

[dev-dependencies]
tempfile.workspace = true
