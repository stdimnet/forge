[package]
name = "forge-search"
description = "Forge code search: persistent trigram index, find in files, fuzzy file names"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-core.workspace = true
serde.workspace = true
tracing.workspace = true
ignore = "0.4"
globset = "0.4"
regex = "1"
regex-syntax = "0.8"
rayon = "1"
bincode = "1"
roaring = { version = "0.10", features = ["serde"] }
notify = "8"
nucleo-matcher = "0.3"

[dev-dependencies]
tempfile.workspace = true
