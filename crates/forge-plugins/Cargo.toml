[package]
name = "forge-plugins"
description = "Forge third-party plugins: manifest validation, .forgeplugin packages, the installed plugin store, permissions and the marketplace client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-plugin-api.workspace = true
forge-keymap.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
semver = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "http2"] }
url = "2"

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
forge-langservers = { workspace = true, features = ["testserver"] }
