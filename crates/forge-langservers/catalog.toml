# Forge's catalog of language servers.
#
# [[language]]: a language Forge can detect in a project.
#   extensions  "ext" or "ext:lspLanguageId" (the LSP id defaults to the language id)
#   file_names  whole file names, same syntax ("Dockerfile", "Gemfile:ruby")
#
# [[server]]: one language server.
#   languages     language ids it serves (all their extensions and file names)
#   group         heading in Settings > Languages & Frameworks > Language Servers
#   alternative   servers sharing a value are alternatives: only the first enabled and
#                 installed one starts (e.g. basedpyright before pyright)
#   plugin        Forge plugin that must be enabled (Settings > Plugins)
#   when          start only if the project has one of these root `files` (a trailing `*`
#                 is a prefix match) or `packages` (package.json dependencies)
#   enabled       default for the per-server toggle (true when omitted)
#   install       ways to install it; `command` is run without a shell. apt / pacman need
#                 root and are only shown. `platforms`: linux, macos, windows (all if empty)
#   initialization_options / settings: sent to the server; the app adds project specific
#                 values (TypeScript SDK, Vue plugin, ESLint workspace folder, ...).

