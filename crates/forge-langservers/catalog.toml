  { tool = "pacman", command = ["sudo", "pacman", "-S", "pyright"], platforms = ["linux"] },
]

[server.settings]
python = { analysis = { typeCheckingMode = "standard", autoSearchPaths = true, useLibraryCodeForTypes = true, diagnosticMode = "openFilesOnly" } }

