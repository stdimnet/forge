# ---- JavaScript & TypeScript -----------------------------------------------------------

[[server]]
id = "typescript-language-server"
name = "TypeScript Language Server"
group = "JavaScript & TypeScript"
languages = ["typescript", "javascript"]
command = "typescript-language-server"
args = ["--stdio"]
alternative = "typescript"
plugin = "forge.web"
homepage = "https://github.com/typescript-language-server/typescript-language-server"
license = "MIT"
note = "Uses the project's TypeScript (node_modules) or a global one. Serves .vue files too when the Vue language server is installed (hybrid mode)."
install = [
  { tool = "npm", command = ["npm", "install", "-g", "typescript-language-server", "typescript"] },
  { tool = "brew", command = ["brew", "install", "typescript-language-server"], platforms = ["macos", "linux"] },
  { tool = "pacman", command = ["sudo", "pacman", "-S", "typescript-language-server"], platforms = ["linux"] },
]

[server.initialization_options]
hostInfo = "forge"
preferences = { includeInlayParameterNameHints = "none", importModuleSpecifierPreference = "shortest", quotePreference = "auto" }

[server.settings]
typescript = { format = { enable = true }, suggest = { completeFunctionCalls = false } }
javascript = { format = { enable = true }, suggest = { completeFunctionCalls = false } }

[[server]]
id = "vtsls"
name = "vtsls"
group = "JavaScript & TypeScript"
languages = ["typescript", "javascript"]
command = "vtsls"
args = ["--stdio"]
alternative = "typescript"
plugin = "forge.web"
homepage = "https://github.com/yioneko/vtsls"
license = "MIT"
note = "Alternative to typescript-language-server built on VS Code's TypeScript extension. Starts only when typescript-language-server is missing or disabled."
install = [
  { tool = "npm", command = ["npm", "install", "-g", "@vtsls/language-server"] },
]

[server.settings]
vtsls = { autoUseWorkspaceTsdk = true }
typescript = { format = { enable = true } }
javascript = { format = { enable = true } }

[[server]]
id = "vscode-eslint-language-server"
name = "ESLint"
group = "JavaScript & TypeScript"
languages = ["javascript", "typescript", "vue", "svelte", "astro"]
command = "vscode-eslint-language-server"
args = ["--stdio"]
plugin = "forge.web"
homepage = "https://github.com/hrsh7th/vscode-langservers-extracted"
license = "MIT"
note = "Starts in projects with an ESLint configuration or an eslint dependency."
when = { files = ["eslint.config.*", ".eslintrc*"], packages = ["eslint"] }
install = [
  { tool = "npm", command = ["npm", "install", "-g", "vscode-langservers-extracted"] },
  { tool = "brew", command = ["brew", "install", "vscode-langservers-extracted"], platforms = ["macos", "linux"] },
]

[server.settings]
validate = "on"
packageManager = "npm"
useESLintClass = false
experimental = { useFlatConfig = false }
codeAction = { disableRuleComment = { enable = true, location = "separateLine" }, showDocumentation = { enable = true } }
codeActionOnSave = { enable = false, mode = "all" }
format = false
quiet = false
onIgnoredFiles = "off"
rulesCustomizations = []
run = "onType"
problems = { shortenToSingleLine = false }
nodePath = ""
workingDirectory = { mode = "location" }

