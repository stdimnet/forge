[[server]]
id = "tailwindcss-language-server"
name = "Tailwind CSS IntelliSense"
group = "HTML & CSS"
languages = ["html", "css", "scss", "javascript", "typescript", "vue", "svelte", "astro", "php", "twig"]
command = "tailwindcss-language-server"
args = ["--stdio"]
plugin = "forge.web"
homepage = "https://github.com/tailwindlabs/tailwindcss-intellisense"
license = "MIT"
note = "Starts in projects with a Tailwind config or a tailwindcss dependency. Class completion in Blade and Twig templates too."
when = { files = ["tailwind.config.*"], packages = ["tailwindcss", "@tailwindcss/vite", "@tailwindcss/postcss"] }
install = [
  { tool = "npm", command = ["npm", "install", "-g", "@tailwindcss/language-server"] },
]

[server.initialization_options]
userLanguages = { php = "html", twig = "html", blade = "html" }

[server.settings]
tailwindCSS = { emmetCompletions = false, validate = true, classAttributes = ["class", "className", ":class", "ngClass"], includeLanguages = { php = "html", twig = "html" }, lint = { cssConflict = "warning", invalidApply = "error", invalidScreen = "error", invalidVariant = "error", invalidConfigPath = "error", invalidTailwindDirective = "error", recommendedVariantOrder = "warning" } }

# ---- Data & configuration ----------------------------------------------------------------

[[server]]
id = "vscode-json-language-server"
name = "JSON Language Server"
group = "JSON"
languages = ["json"]
command = "vscode-json-language-server"
args = ["--stdio"]
homepage = "https://github.com/hrsh7th/vscode-langservers-extracted"
license = "MIT"
note = "Validates composer.json, package.json, tsconfig.json and more with schemas from SchemaStore (downloaded by the server)."
install = [
  { tool = "npm", command = ["npm", "install", "-g", "vscode-langservers-extracted"] },
  { tool = "brew", command = ["brew", "install", "vscode-langservers-extracted"], platforms = ["macos", "linux"] },
]

[server.initialization_options]
provideFormatter = true

[server.settings.json]
validate = { enable = true }
format = { enable = true }
schemas = [
  { fileMatch = ["composer.json"], url = "https://getcomposer.org/schema.json" },
  { fileMatch = ["package.json"], url = "https://json.schemastore.org/package.json" },
  { fileMatch = ["tsconfig.json", "tsconfig.*.json"], url = "https://json.schemastore.org/tsconfig.json" },
  { fileMatch = ["jsconfig.json", "jsconfig.*.json"], url = "https://json.schemastore.org/jsconfig.json" },
  { fileMatch = [".eslintrc", ".eslintrc.json"], url = "https://json.schemastore.org/eslintrc.json" },
  { fileMatch = [".prettierrc", ".prettierrc.json"], url = "https://json.schemastore.org/prettierrc.json" },
  { fileMatch = [".babelrc", "babel.config.json"], url = "https://json.schemastore.org/babelrc.json" },
  { fileMatch = ["phpstan.json"], url = "https://json.schemastore.org/phpstan.json" },
  { fileMatch = ["infection.json", "infection.json5"], url = "https://raw.githubusercontent.com/infection/infection/master/resources/schema.json" },
  { fileMatch = [".luarc.json"], url = "https://raw.githubusercontent.com/LuaLS/vscode-lua/master/setting/schema.json" },
  { fileMatch = ["*.schema.json"], url = "https://json-schema.org/draft/2020-12/schema" },
]

[[server]]
id = "yaml-language-server"
name = "YAML Language Server"
group = "YAML"
languages = ["yaml", "dockercompose"]
command = "yaml-language-server"
args = ["--stdio"]
homepage = "https://github.com/redhat-developer/yaml-language-server"
license = "MIT"
note = "Schemas for GitHub Actions, docker-compose and Kubernetes manifests (in k8s/, kubernetes/, deploy/ or manifests/)."
install = [
  { tool = "npm", command = ["npm", "install", "-g", "yaml-language-server"] },
  { tool = "brew", command = ["brew", "install", "yaml-language-server"], platforms = ["macos", "linux"] },
  { tool = "pacman", command = ["sudo", "pacman", "-S", "yaml-language-server"], platforms = ["linux"] },
]

[server.settings.yaml]
validate = true
hover = true
completion = true
format = { enable = true }
keyOrdering = false
# Docker Compose merge tags (https://docs.docker.com/reference/compose-file/merge/), which
# the server reports as "Unresolved tag" unless they are declared for every node kind.
customTags = [
  "!reset scalar", "!reset sequence", "!reset mapping",
  "!override scalar", "!override sequence", "!override mapping",
]
schemaStore = { enable = true, url = "https://www.schemastore.org/api/json/catalog.json" }

[server.settings.yaml.schemas]
"https://json.schemastore.org/github-workflow.json" = ".github/workflows/*.{yml,yaml}"
"https://json.schemastore.org/github-action.json" = ["action.yml", "action.yaml"]
"https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json" = ["docker-compose*.yml", "docker-compose*.yaml", "compose.yml", "compose.yaml"]
"kubernetes" = ["k8s/**/*.yaml", "k8s/**/*.yml", "kubernetes/**/*.yaml", "deploy/**/*.yaml", "manifests/**/*.yaml"]
"https://json.schemastore.org/gitlab-ci.json" = ".gitlab-ci.yml"

[[server]]
id = "taplo"
name = "Taplo (TOML)"
