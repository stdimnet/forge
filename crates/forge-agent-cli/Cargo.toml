[package]
name = "forge-agent-cli"
description = "Runs AI coding agent CLIs (Claude Code, Gemini CLI) headless and normalizes their output"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["runtime"]
# The CLI adapters and sessions (processes, tokio). Without it only the pure event,
# prompt, conversation and diff modules are built (e.g. for WebAssembly).
runtime = ["dep:forge-core", "dep:tokio", "dep:tracing"]

[dependencies]
forge-core = { workspace = true, optional = true }
forge-markdown.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = "2"
tokio = { workspace = true, optional = true, features = ["process", "io-util", "sync", "rt", "macros", "time"] }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
