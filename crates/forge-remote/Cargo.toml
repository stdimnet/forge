[package]
name = "forge-remote"
description = "Forge IDE remote development: SSH connections, host keys, ~/.ssh/config and the Forge agent deployment"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["client"]
# SSH sessions (russh, tokio), agent upload, reconnects and the saved configurations store.
# Without it only the pure modules are built (ssh_config, known_hosts, deploy plans,
# targets), e.g. for WebAssembly.
client = [
    "dep:forge-backend",
    "dep:forge-core",
    "dep:russh",
    "dep:tokio",
    "dep:tracing",
    "dep:dirs",
    "dep:keyring",
    "dep:toml",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
forge-backend = { workspace = true, optional = true }
forge-core = { workspace = true, optional = true }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"], optional = true }
tokio = { workspace = true, optional = true, features = ["net", "io-util", "sync", "rt", "macros", "time", "fs"] }
tracing = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
forge-remote-agent = { path = "../forge-remote-agent" }
