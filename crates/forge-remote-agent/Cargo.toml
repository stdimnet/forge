[package]
name = "forge-remote-agent"
description = "Headless Forge agent: serves a project's files, git, processes, language servers and PHP index over stdio for remote development"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "forge-remote-agent"
path = "src/main.rs"

[dependencies]
forge-backend.workspace = true
forge-core.workspace = true
forge-process.workspace = true
forge-vcs.workspace = true
forge-lsp.workspace = true
forge-project.workspace = true
serde.workspace = true
serde_bytes = "0.11"
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
phpforge-fw-laravel = { path = "../../packs/phpforge/fw-laravel" }
phpforge-fw-symfony = { path = "../../packs/phpforge/fw-symfony" }
phpforge-orm-doctrine = { path = "../../packs/phpforge/orm-doctrine" }
forge-langservers = { path = "../forge-langservers", default-features = false }

# forge-lsp's fake language server, to test language servers started through the agent
# (never shipped: `pnpm agents` builds only `forge-remote-agent`).
[[bin]]
name = "forge-remote-agent-fake-lsp"
path = "../forge-lsp/tests/support/fake_server.rs"
test = false
doc = false
