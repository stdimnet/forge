[package]
name = "forge-db"
description = "Forge IDE database tools: data sources, introspection, query execution and data editing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
dirs.workspace = true
tracing.workspace = true
tokio.workspace = true
futures-util = "0.3"
tokio-util = "0.7"
hex = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "chrono", "bigdecimal", "uuid", "json"] }

[dev-dependencies]
tempfile.workspace = true
