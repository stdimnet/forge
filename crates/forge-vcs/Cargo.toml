[package]
name = "forge-vcs"
description = "Forge IDE version control: drives the git CLI and parses its output"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["git"]
# Running git (local or through a `GitExec`). Without it only the pure parsers and the
# three-way merge are built (e.g. for WebAssembly).
git = ["dep:forge-core", "dep:tracing", "dep:serde_json"]

[dependencies]
forge-core = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
similar = "2"
tracing = { workspace = true, optional = true }

[dev-dependencies]
forge-core.workspace = true
tempfile.workspace = true
serde_json.workspace = true
