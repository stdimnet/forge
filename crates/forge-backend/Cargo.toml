[package]
name = "forge-backend"
description = "Forge IDE project backends: the Backend trait, the local backend and the remote agent protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
forge-core.workspace = true
forge-vcs.workspace = true
forge-process.workspace = true
forge-lsp.workspace = true
forge-project.workspace = true
phpforge-lang-php = { path = "../../packs/phpforge/lang-php" }
phpforge-fw-laravel = { path = "../../packs/phpforge/fw-laravel" }
phpforge-fw-symfony = { path = "../../packs/phpforge/fw-symfony" }
phpforge-orm-doctrine = { path = "../../packs/phpforge/orm-doctrine" }
phpforge-dql = { path = "../../packs/phpforge/dql" }
webforge-lang-web = { path = "../../packs/webforge/lang-web" }
webforge-fw-react = { path = "../../packs/webforge/fw-react" }
webforge-fw-vue = { path = "../../packs/webforge/fw-vue" }
webforge-fw-angular = { path = "../../packs/webforge/fw-angular" }
# Without the keychain: the remote agent embeds this crate and is linked statically.
forge-langservers = { path = "../forge-langservers", default-features = false }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "rt", "macros", "time", "process"] }
tracing.workspace = true
futures-util = "0.3"
rmp-serde = "1.3"
serde_bytes = "0.11"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
