[package]
name = "forge-backend"
description = "Forge IDE project backends: the Backend trait, the local backend and the remote agent protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["search"]
# Trigram index behind Find in Files, Go to File and symbol search.
search = ["dep:forge-search"]

[dependencies]
forge-core.workspace = true
forge-search-core.workspace = true
forge-search = { workspace = true, optional = true }
forge-vcs.workspace = true
forge-process.workspace = true
forge-lsp.workspace = true
forge-project.workspace = true
phpforge-lang-php = { path = "../../packs/phpforge/lang-php" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "rt", "macros", "time", "process"] }
tracing.workspace = true
futures-util = "0.3"
rmp-serde = "1.3"
serde_bytes = "0.11"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
