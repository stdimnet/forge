id = "forge.php"
name = "PHP"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
description = "PHP language support: completion, inspections, navigation and refactorings via Intelephense."
projectTypes = ["php"]

[contributions]
languages = ["php", "phtml"]

[[contributions.commands]]
id = "php.runFile"
title = "Run PHP Script"
category = "Run"

[[contributions.lspServers]]
id = "intelephense"
languageId = "php"
command = "intelephense"
args = ["--stdio"]
fileExtensions = ["php", "phtml"]
initializationOptions = { storagePath = ".forge/intelephense", clearCache = false }

[[contributions.runConfigurationTypes]]
id = "php-script"
name = "PHP Script"
description = "Run a PHP file with the CLI interpreter."
icon = "file-code"
debuggable = true

[[contributions.runConfigurationTypes]]
id = "php-builtin-server"
name = "PHP Built-in Web Server"
description = "Serve a document root with `php -S`."
icon = "globe"
debuggable = true

[[contributions.codeGenerators]]
id = "php.constructor"
title = "Constructor"
languages = ["php"]

[[contributions.codeGenerators]]
id = "php.gettersSetters"
title = "Getters and Setters"
languages = ["php"]

[[contributions.codeGenerators]]
id = "php.phpdoc"
title = "PHPDoc Blocks"
languages = ["php"]

[[contributions.codeGenerators]]
id = "php.implementMethods"
title = "Implement Methods…"
languages = ["php"]

# ---- Languages & Frameworks > PHP ----------------------------------------------------

[[contributions.settings]]
key = "php.languageLevel"
title = "PHP language level"
description = "Inspections and completion follow the syntax of this version."
type = "enum"
options = [
  { value = "7.4", label = "7.4 (arrow functions, typed properties)" },
  { value = "8.0", label = "8.0 (named arguments, match, union types)" },
  { value = "8.1", label = "8.1 (enums, readonly properties)" },
  { value = "8.2", label = "8.2 (readonly classes, DNF types)" },
  { value = "8.3", label = "8.3 (typed class constants)" },
  { value = "8.4", label = "8.4 (property hooks, asymmetric visibility)" },
  { value = "interpreter", label = "From the CLI interpreter" },
]
default = "8.3"
group = "lang.php"
section = "Development Environment"
project = true
order = 0

[[contributions.settings]]
key = "php.interpreter"
title = "CLI Interpreter"
description = "The interpreter that runs scripts and tests: the name of an interpreter of the CLI Interpreters dialog, or the path of a local php executable."
type = "string"
default = "php"
group = "lang.php"
section = "Development Environment"
project = true
order = 1

[[contributions.settings]]
key = "php.interpreters"
title = "CLI Interpreters"
description = "PHP interpreters available in every project: local, Docker, Docker Compose, SSH and WSL (edited in the CLI Interpreters dialog)."
type = "objects"
unique = ["name"]
default = []
group = "lang.php"
section = "Development Environment"
order = 2

[[contributions.settings]]
key = "php.projectInterpreters"
title = "CLI Interpreters of this project"
description = "Interpreters marked \"Visible only for this project\"."
type = "objects"
unique = ["name"]
default = []
group = "lang.php"
section = "Development Environment"
project = true
order = 3

[[contributions.settings]]
key = "php.testFrameworks"
title = "Test frameworks"
description = "PHPUnit, Pest, Codeception, Behat and PHPSpec per CLI interpreter: Composer autoloader or path to the executable, default configuration and bootstrap files. Frameworks the project uses are detected."
type = "objects"
default = []
group = "lang.php.test-frameworks"
project = true
order = 0

[[contributions.settings]]
key = "php.includePaths"
title = "Include path"
description = "Extra directories indexed as libraries (e.g. global PEAR or framework stubs)."
type = "list"
default = []
group = "lang.php"
section = "Include Path"
project = true
order = 10

[[contributions.settings]]
key = "php.sourceRoots"
title = "Source roots"
description = "Folders marked as Sources Root or Test Sources Root with their package prefix (Settings | Directories, Project view: Mark Directory as). They change the PSR-4 roots composer.json declares (kind `none` unmarks one); New PHP Class, Move Class and the namespace inspection use them."
type = "objects"
unique = ["path"]
default = []
group = "directories"
project = true
order = 0

[[contributions.settings]]
key = "php.inspections.enabled"
title = "Inspections from PHPStorm metadata and attributes"
description = "Deprecated symbols, expected values, #[Immutable] writes, unused #[Pure] results, unreachable code after exit points and the PSR-0/PSR-4 namespace check."
type = "bool"
default = true
group = "lang.php"
section = "Inspections"
order = 30

[[contributions.settings]]
key = "php.stubs.path"
title = "Default stubs path"
description = "A phpstorm-stubs checkout used for PHP's own classes, functions and constants (Go to Declaration on \\Throwable, array_map). Empty: Forge downloads JetBrains' phpstorm-stubs into its cache folder on first use, or uses Intelephense's stubs."
type = "path"
default = ""
group = "lang.php"
section = "PHP Runtime"
order = 20

[[contributions.settings]]
key = "php.lsp.server"
title = "Language server"
description = "Started automatically when a PHP project opens."
type = "enum"
options = [
  { value = "auto", label = "Auto (Intelephense, else phpactor)" },
  { value = "intelephense", label = "Intelephense" },
  { value = "phpactor", label = "phpactor" },
  { value = "none", label = "None (built-in index only)" },
]
default = "auto"
group = "lang.php"
section = "Language Server"
order = 19

[[contributions.settings]]
key = "php.intelephense.autoInstall"
title = "When Intelephense is not installed"
description = "Forge downloads Intelephense from the npm registry into its own directory (and Node.js when none is installed). Intelephense is not bundled with Forge."
type = "enum"
options = [
  { value = "ask", label = "Ask when a PHP project opens" },
  { value = "always", label = "Install automatically" },
  { value = "never", label = "Do not install" },
]
default = "ask"
group = "lang.php"
section = "Language Server"
order = 21

[[contributions.settings]]
key = "php.intelephense.licenceAccepted"
title = "I accept the Intelephense licence"
description = "Asked once before Forge downloads Intelephense for you. Its licence (LICENSE.txt in the npm package, intelephense.com) applies to your copy."
type = "bool"
default = false
group = "lang.php"
section = "Language Server"
order = 22

[[contributions.settings]]
key = "php.lsp.maxFileSize"
title = "Max indexed file size (KB)"
type = "int"
min = 100
max = 100000
default = 5000
group = "lang.php"
section = "Language Server"
order = 20

