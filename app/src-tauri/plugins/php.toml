[[contributions.inspections]]
id = "PhpDeprecation"
name = "Deprecated symbol usage"
group = "PHP/General"
language = "php"
severity = "WEAK WARNING"
description = "Reports usages of classes, functions, methods, properties and constants marked #[Deprecated] or @deprecated. The quick fix replaces the call when the attribute names a replacement."

[[contributions.inspections]]
id = "PhpIllegalPsrClassPath"
name = "Namespace does not match the PSR-0/PSR-4 project structure"
group = "PHP/General"
language = "php"
severity = "WARNING"
description = "Reports a namespace that does not match the file's place under the source roots of composer.json (and Mark Directory as). The quick fix sets the expected namespace."

[[contributions.inspections]]
id = "PhpExpectedValuesShouldBeUsed"
name = "Expected values should be used"
group = "PHP/Probable bugs"
language = "php"
severity = "WARNING"
description = "Reports literal arguments, comparisons and return values that are not among the values #[ExpectedValues] or .phpstorm.meta.php expectedArguments() allow."

[[contributions.inspections]]
id = "PhpImmutablePropertyIsChanged"
name = "Immutable property written outside its scope"
group = "PHP/Probable bugs"
language = "php"
severity = "WARNING"
description = "Reports writes to properties marked #[Immutable] outside the constructor or the allowed write scope."

[[contributions.inspections]]
id = "PhpExpressionResultUnused"
name = "Result of a pure function is not used"
group = "PHP/Probable bugs"
language = "php"
severity = "WEAK WARNING"
description = "Reports calls of functions and methods marked #[Pure] whose result is thrown away."

[[contributions.inspections]]
id = "PhpUnreachableStatement"
name = "Unreachable statement"
group = "PHP/Control flow"
language = "php"
severity = "WEAK WARNING"
description = "Reports statements after calls that never return (#[NoReturn], exitPoint() in .phpstorm.meta.php)."

[[contributions.inspections]]
id = "PhpVariableIsAlwaysNull"
name = "Variable is always null"
group = "PHP/Data flow"
language = "php"
severity = "WARNING"
description = "Reports member accesses and method calls on a variable that holds null on every path that reaches them."

[[contributions.inspections]]
id = "PhpUndefinedVariable"
name = "Undefined variable"
group = "PHP/Data flow"
language = "php"
severity = "WARNING"
description = "Reports variables read inside a function before any path assigned them. Functions that use $$name, extract(), compact(), eval or include are not checked."

[[contributions.inspections]]
id = "PhpConstantCondition"
name = "Condition is always true or false"
group = "PHP/Data flow"
language = "php"
severity = "WARNING"
description = "Reports if, elseif, while and ternary conditions whose value is known from literals and variables holding known constants (while (true) loops are not reported)."

[[contributions.inspections]]
id = "PhpUnusedAssignment"
name = "Unused assignment"
group = "PHP/Data flow"
language = "php"
severity = "WEAK WARNING"
cleanup = true
description = "Reports values assigned to local variables that are overwritten before they are read, or never read afterwards. The quick fix removes the assignment and keeps an expression with side effects."

