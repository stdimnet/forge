id = "forge.php"
name = "PHP"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
description = "PHP language support: completion, inspections, navigation and refactorings via Intelephense."
projectTypes = ["php"]

[contributions]
languages = ["php", "phtml"]

[[contributions.commands]]
id = "php.runFile"
title = "Run PHP Script"
category = "Run"

[[contributions.lspServers]]
id = "intelephense"
languageId = "php"
command = "intelephense"
args = ["--stdio"]
fileExtensions = ["php", "phtml"]
initializationOptions = { storagePath = ".forge/intelephense", clearCache = false }

[[contributions.runConfigurationTypes]]
id = "php-script"
name = "PHP Script"
description = "Run a PHP file with the CLI interpreter."
icon = "file-code"
debuggable = true

[[contributions.runConfigurationTypes]]
id = "php-builtin-server"
name = "PHP Built-in Web Server"
description = "Serve a document root with `php -S`."
icon = "globe"
debuggable = true

[[contributions.codeGenerators]]
id = "php.constructor"
title = "Constructor"
languages = ["php"]

[[contributions.codeGenerators]]
id = "php.gettersSetters"
title = "Getters and Setters"
languages = ["php"]

[[contributions.codeGenerators]]
id = "php.phpdoc"
title = "PHPDoc Blocks"
languages = ["php"]

[[contributions.codeGenerators]]
id = "php.implementMethods"
title = "Implement Methods…"
languages = ["php"]

# ---- Languages & Frameworks > PHP ----------------------------------------------------

[[contributions.settings]]
key = "php.languageLevel"
title = "PHP language level"
description = "Inspections and completion follow the syntax of this version."
type = "enum"
options = [
  { value = "7.4", label = "7.4 (arrow functions, typed properties)" },
  { value = "8.0", label = "8.0 (named arguments, match, union types)" },
  { value = "8.1", label = "8.1 (enums, readonly properties)" },
  { value = "8.2", label = "8.2 (readonly classes, DNF types)" },
  { value = "8.3", label = "8.3 (typed class constants)" },
  { value = "8.4", label = "8.4 (property hooks, asymmetric visibility)" },
  { value = "interpreter", label = "From the CLI interpreter" },
]
default = "8.3"
group = "lang.php"
section = "Development Environment"
project = true
order = 0

[[contributions.settings]]
key = "php.interpreter"
title = "CLI Interpreter"
description = "The interpreter that runs scripts and tests: the name of an interpreter of the CLI Interpreters dialog, or the path of a local php executable."
type = "string"
default = "php"
group = "lang.php"
section = "Development Environment"
project = true
order = 1

[[contributions.settings]]
key = "php.interpreters"
title = "CLI Interpreters"
description = "PHP interpreters available in every project: local, Docker, Docker Compose, SSH and WSL (edited in the CLI Interpreters dialog)."
type = "objects"
unique = ["name"]
default = []
group = "lang.php"
section = "Development Environment"
order = 2

[[contributions.settings]]
key = "php.projectInterpreters"
title = "CLI Interpreters of this project"
description = "Interpreters marked \"Visible only for this project\"."
type = "objects"
unique = ["name"]
default = []
group = "lang.php"
section = "Development Environment"
project = true
order = 3

[[contributions.settings]]
key = "php.includePaths"
title = "Include path"
description = "Extra directories indexed as libraries (e.g. global PEAR or framework stubs)."
type = "list"
default = []
group = "lang.php"
section = "Include Path"
project = true
order = 10

[[contributions.settings]]
key = "php.sourceRoots"
title = "Source roots"
description = "Folders marked as Sources Root or Test Sources Root with their package prefix (Settings | Directories, Project view: Mark Directory as). They change the PSR-4 roots composer.json declares (kind `none` unmarks one); New PHP Class, Move Class and the namespace inspection use them."
type = "objects"
unique = ["path"]
default = []
group = "directories"
project = true
order = 0

[[contributions.settings]]
key = "php.inspections.enabled"
title = "Inspections from PHPStorm metadata and attributes"
description = "Deprecated symbols, expected values, #[Immutable] writes, unused #[Pure] results, unreachable code after exit points and the PSR-0/PSR-4 namespace check."
type = "bool"
default = true
group = "lang.php"
section = "Inspections"
order = 30

[[contributions.settings]]
key = "php.stubs.path"
title = "Default stubs path"
description = "A phpstorm-stubs checkout used for PHP's own classes, functions and constants (Go to Declaration on \\Throwable, array_map). Empty: Forge downloads JetBrains' phpstorm-stubs into its cache folder on first use, or uses Intelephense's stubs."
type = "path"
default = ""
group = "lang.php"
section = "PHP Runtime"
order = 20

[[contributions.settings]]
key = "php.lsp.server"
title = "Language server"
description = "Started automatically when a PHP project opens."
type = "enum"
options = [
  { value = "auto", label = "Auto (Intelephense, else phpactor)" },
  { value = "intelephense", label = "Intelephense" },
  { value = "phpactor", label = "phpactor" },
  { value = "none", label = "None (built-in index only)" },
]
default = "auto"
group = "lang.php"
section = "Language Server"
order = 19

[[contributions.settings]]
key = "php.intelephense.autoInstall"
title = "When Intelephense is not installed"
description = "Forge downloads Intelephense from the npm registry into its own directory (and Node.js when none is installed). Intelephense is not bundled with Forge."
type = "enum"
options = [
  { value = "ask", label = "Ask when a PHP project opens" },
  { value = "always", label = "Install automatically" },
  { value = "never", label = "Do not install" },
]
default = "ask"
group = "lang.php"
section = "Language Server"
order = 21

[[contributions.settings]]
key = "php.intelephense.licenceAccepted"
title = "I accept the Intelephense licence"
description = "Asked once before Forge downloads Intelephense for you. Its licence (LICENSE.txt in the npm package, intelephense.com) applies to your copy."
type = "bool"
default = false
group = "lang.php"
section = "Language Server"
order = 22

[[contributions.settings]]
key = "php.lsp.maxFileSize"
title = "Max indexed file size (KB)"
type = "int"
min = 100
max = 100000
default = 5000
group = "lang.php"
section = "Language Server"
order = 20

# Editor > Code Style > PHP is rendered from the code style model (`forge-codestyle`); its
# options are stored under `php.codeStyle.*` (Default scheme: user settings, Project scheme:
# project settings).

# ---- Tools > Actions on Save (PHP tools) ------------------------------------------------

[[contributions.settings]]
key = "actionsOnSave.phpCsFixer"
title = "Run PHP CS Fixer"
description = "Run `php-cs-fixer fix` on saved PHP files."
type = "bool"
default = false
group = "tools.actions-on-save"
project = true
order = 60

[[contributions.settings]]
key = "actionsOnSave.pint"
title = "Run Laravel Pint"
description = "Run `pint` on saved PHP files."
type = "bool"
default = false
group = "tools.actions-on-save"
project = true
order = 70

# ---- Languages & Frameworks > PHP > Quality Tools --------------------------------------

[[contributions.settings]]
key = "php.tools.phpCsFixer.path"
title = "PHP CS Fixer path"
description = "Empty: vendor/bin/php-cs-fixer of the project. A relative path starts at the project root. The project's .php-cs-fixer.dist.php is used."
type = "path"
default = ""
group = "lang.php.quality-tools"
section = "PHP CS Fixer"
project = true
order = 0

[[contributions.settings]]
key = "php.tools.pint.path"
title = "Laravel Pint path"
description = "Empty: vendor/bin/pint of the project. A relative path starts at the project root. The project's pint.json is used."
type = "path"
default = ""
group = "lang.php.quality-tools"
section = "Laravel Pint"
project = true
order = 10

# ---- Editor > General > Auto Import (PHP) ------------------------------------------------

[[contributions.settings]]
key = "php.autoImport.addOnTheFly"
title = "Add unambiguous imports on the fly"
description = "Import a class as soon as you stop typing its name when exactly one class has that name."
type = "bool"
default = false
group = "editor.general.auto-import"
section = "PHP"
order = 0

[[contributions.settings]]
key = "php.autoImport.optimizeOnTheFly"
title = "Optimize imports on the fly"
description = "Remove unused 'use' statements while you edit, but not while you work on the imports or type a name one of them provides."
type = "bool"
default = false
group = "editor.general.auto-import"
section = "PHP"
order = 1

[[contributions.settings]]
key = "php.autoImport.showPopup"
title = "Show import popup"
description = "Show a hint with the class to import on unresolved class names; press Alt+Enter to import it."
type = "bool"
default = true
group = "editor.general.auto-import"
section = "PHP"
order = 2

[[contributions.settings]]
key = "php.autoImport.namespaceScope"
title = "Enable auto-import in namespace scope"
description = "Completion adds a 'use' statement in files with a namespace; otherwise it inserts the fully qualified name."
type = "bool"
default = true
group = "editor.general.auto-import"
section = "PHP"
order = 3

[[contributions.settings]]
key = "php.autoImport.fileScope"
title = "Enable auto-import in file scope"
description = "Completion adds a 'use' statement in files without a namespace."
type = "bool"
default = false
group = "editor.general.auto-import"
section = "PHP"
order = 4

[[contributions.settings]]
key = "php.autoImport.fqnInPhpDoc"
title = "Prefer FQN in PHPDoc"
description = "Class names completed or imported in PHPDoc comments are written fully qualified."
type = "bool"
default = false
group = "editor.general.auto-import"
section = "PHP"
order = 5

[[contributions.settings]]
key = "php.autoImport.globalNamespace"
title = "Import classes from the global namespace"
description = "Add 'use Exception;' for PHP's own classes in namespaced files instead of writing '\\Exception'."
type = "bool"
default = true
group = "editor.general.auto-import"
section = "PHP"
order = 6
