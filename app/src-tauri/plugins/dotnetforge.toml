# DotNetForge: .NET in the style of Rider. The logic lives in packs/dotnetforge (lang-dotnet:
# solutions, MSBuild projects, launch profiles, global.json, build output, test discovery and
# the .NET test provider, dotnet command lines, NuGet answers, dotnet format; sdk: .NET host
# and SDK detection, netcoredbg and Roslyn locations, the NuGet feed client). The Roslyn
# language server and netcoredbg are downloaded on request (forge_langservers::managed::roslyn
# and ::netcoredbg); app/src-tauri/src/commands/dotnet.rs wires them up.

[[plugin]]
id = "forge.dotnet"
name = ".NET"
version = "0.1.0"
pack = "dotnetforge"
vendor = "Forge"
projectTypes = ["dotnetforge"]
depends = ["forge.debugger"]
description = "Solutions (.sln, .slnx) and MSBuild projects, .NET SDKs and global.json, the Build and NuGet tool windows, .NET Project run configurations with launch profiles and dotnet watch, xUnit / NUnit / MSTest through dotnet test, netcoredbg debugging, dotnet new templates, Code Cleanup with dotnet format and EditorConfig, and the Roslyn language server. For web and cloud projects: ASP.NET Core endpoints, Razor and Blazor, EF Core, .NET Aspire, Docker, Hot Reload and user secrets."

[plugin.contributions]
languages = ["csharp", "fsharp", "vb"]

[[plugin.contributions.fileTypes]]
id = "msbuild"
name = "MSBuild"
extensions = ["csproj", "fsproj", "vbproj", "props", "targets", "slnx", "nuspec", "runsettings", "resx", "proj"]
indentSize = 2

[[plugin.contributions.fileTypes]]
id = "sln"
name = "Solution File"
extensions = ["sln"]
indentSize = 4

[[plugin.contributions.fileTypes]]
