[[plugin.contributions.runConfigurationTypes]]
id = "dotnet"
name = ".NET Project"
description = "Run a .NET project with dotnet run or dotnet watch, optionally with a launch profile of Properties/launchSettings.json; Debug starts the built assembly under netcoredbg."
icon = "app-window"
debuggable = true

[[plugin.contributions.runConfigurationTypes]]
id = "dotnet-aspire"
name = ".NET Aspire"
description = "Run a .NET Aspire AppHost with dotnet run: its resources show up in the Services tool window, the dashboard link in the console."
icon = "boxes"

[[plugin.contributions.runConfigurationTypes]]
id = "dotnet-docker"
name = ".NET Docker"
description = "Build a .NET project's Dockerfile from the solution folder (docker build) and run the image as a container with published ports and environment."
icon = "container"

# The .NET test provider (dotnetforge_lang_dotnet::provider) wraps this spec: discovery of
# xUnit, NUnit and MSTest classes and methods, `dotnet test` command lines with filters and a
# TRX report, Rerun Failed Tests and the location rules of the test classes are built in Rust.
[[plugin.contributions.testFrameworks]]
id = "dotnet-test"
name = ".NET Tests"
description = "Run xUnit, NUnit or MSTest tests with dotnet test: the solution, a project, a class, a method or a filter; results from the TRX report."
icon = "flask-conical"
language = "csharp"
detect = { files = ["*.csproj", "*/*.csproj", "**/*.csproj", "*.fsproj", "*/*.fsproj", "**/*.fsproj", "*.vbproj", "**/*.vbproj"] }
testFiles = ["*.cs", "*.fs"]
program = "dotnet"
report = "jUnitFile"
debuggable = true

[plugin.contributions.testFrameworks.scopes]
all = []
test = ["${test}"]
pattern = ["${pattern}"]

# netcoredbg (MIT, Samsung) speaks the Debug Adapter Protocol with --interpreter=vscode.
[[plugin.contributions.debugAdapters]]
type = "coreclr"
label = ".NET (netcoredbg)"
command = "netcoredbg"
args = ["--interpreter=vscode"]
commandSetting = "dotnet.debugger.path"
languages = ["cs", "fs", "vb"]
launch = { program = "${program}", args = "${args}", cwd = "${cwd}", env = "${env}", stopAtEntry = "${stopOnEntry}" }
attach = { processId = "${pid}" }
launchSchema = { type = "object", properties = { justMyCode = { type = "boolean", description = "Step through your code only" }, enableStepFiltering = { type = "boolean", description = "Step over properties and operators" } } }

