# WebForge: HTML, CSS, JavaScript and TypeScript, npm, and the React, Vue.js and Angular
# frameworks. Each table is one plugin. Logic lives in packs/webforge/*.

[[plugin]]
id = "forge.web"
name = "HTML, CSS & JavaScript"
version = "0.1.0"
pack = "webforge"
vendor = "Forge"
description = "HTML, CSS, JavaScript and TypeScript editing with language servers, npm scripts and package managers."
projectTypes = ["webforge"]

[plugin.contributions]
languages = ["html", "css", "scss", "js", "mjs", "ts", "tsx", "jsx"]

[[plugin.contributions.lspServers]]
id = "typescript-language-server"
languageId = "typescript"
command = "typescript-language-server"
args = ["--stdio"]
fileExtensions = ["js", "mjs", "cjs", "jsx", "ts", "tsx"]

[[plugin.contributions.lspServers]]
id = "vscode-css-language-server"
languageId = "css"
command = "vscode-css-language-server"
args = ["--stdio"]
fileExtensions = ["css", "scss", "less"]

[[plugin.contributions.lspServers]]
id = "vscode-html-language-server"
languageId = "html"
command = "vscode-html-language-server"
args = ["--stdio"]
fileExtensions = ["html", "htm"]

[[plugin.contributions.runConfigurationTypes]]
id = "npm"
name = "npm"
description = "Run a package.json script."
icon = "package"
debuggable = true

[[plugin.contributions.toolWindows]]
id = "npm"
title = "npm"
anchor = "left"
icon = "hexagon"
order = 30

[[plugin.contributions.commands]]
id = "npm.reload"
title = "Reload npm Scripts"
category = "Tools"

[[plugin.contributions.commands]]
id = "npm.install"
title = "Install Dependencies"
category = "Tools"

# ---- Languages & Frameworks > Node.js -------------------------------------------------

[[plugin.contributions.settings]]
key = "web.packageManager"
title = "Package manager"
description = "Auto uses the packageManager field of package.json, else the lock file (pnpm-lock.yaml, yarn.lock, bun.lock, package-lock.json)."
type = "enum"
options = [
  { value = "auto", label = "Auto (packageManager field or lock file)" },
  { value = "npm", label = "npm" },
  { value = "pnpm", label = "pnpm" },
  { value = "yarn", label = "yarn" },
  { value = "bun", label = "bun" },
]
default = "auto"
group = "lang.node"
section = "Package Manager"
project = true
order = 0

[[plugin.contributions.settings]]
key = "web.npm.gutterIcons"
title = "Show run icons next to scripts in package.json"
type = "bool"
default = true
group = "lang.node"
section = "npm Scripts"
order = 10

[[plugin.contributions.settings]]
key = "web.npm.debugArguments"
title = "Node options when debugging scripts"
description = "Set as NODE_OPTIONS for Debug; attach Chrome DevTools or another inspector client to the port."
type = "string"
default = "--inspect"
group = "lang.node"
section = "npm Scripts"
order = 11

# ---- Languages & Frameworks > TypeScript ----------------------------------------------

[[plugin.contributions.settings]]
key = "web.navigation.components"
title = "Navigate from JSX and template tags to components, props and events"
description = "Ctrl+B and Ctrl+Click on <UserCard>, title=… and @select resolve through imports before the language server is asked."
type = "bool"
default = true
group = "lang.typescript"
section = "Frameworks"
order = 0

# ---- Tools > Actions on Save (JavaScript tools) -----------------------------------------

[[plugin.contributions.settings]]
key = "actionsOnSave.eslint"
title = "Run eslint --fix"
description = "Fix ESLint problems in saved JavaScript, TypeScript and Vue files."
type = "bool"
default = false
group = "tools.actions-on-save"
project = true
order = 40

[[plugin.contributions.settings]]
key = "actionsOnSave.prettier.enabled"
title = "Run Prettier"
description = "Run `prettier --write` on saved files that match the patterns below."
type = "bool"
default = false
group = "tools.actions-on-save"
project = true
order = 50

[[plugin.contributions.settings]]
key = "actionsOnSave.prettier.files"
title = "Run for files"
description = "Patterns separated by `;`; patterns with a `/` match the path, the others the file name."
type = "string"
default = "*.js; *.ts; *.jsx; *.tsx; *.cjs; *.cts; *.mjs; *.mts; *.vue; *.astro"
group = "tools.actions-on-save"
project = true
order = 51

# ---- Languages & Frameworks > ESLint / Prettier -----------------------------------------

[[plugin.contributions.settings]]
key = "web.eslint.path"
title = "ESLint package"
description = "Empty: node_modules/.bin/eslint of the project. A relative path starts at the project root. The project's ESLint configuration is used."
type = "path"
default = ""
group = "lang.eslint"
project = true
order = 0

[[plugin.contributions.settings]]
key = "web.prettier.path"
title = "Prettier package"
description = "Empty: node_modules/.bin/prettier of the project. A relative path starts at the project root. The project's Prettier configuration is used."
type = "path"
default = ""
group = "lang.prettier"
project = true
order = 0

# ---- Editor > General > Auto Import (JavaScript and TypeScript) --------------------------

[[plugin.contributions.settings]]
key = "javascript.autoImport.addOnTheFly"
title = "Add unambiguous imports on the fly"
description = "Import names the TypeScript server can resolve to exactly one module after you stop typing."
type = "bool"
default = false
group = "editor.general.auto-import"
section = "JavaScript and TypeScript"
order = 10

[[plugin.contributions.settings]]
key = "javascript.autoImport.optimizeOnTheFly"
title = "Optimize imports on the fly"
description = "Remove unused imports while you edit, but not on the lines you are editing."
type = "bool"
default = false
group = "editor.general.auto-import"
section = "JavaScript and TypeScript"
order = 11

[[plugin.contributions.settings]]
key = "javascript.autoImport.showPopup"
title = "Show import popup"
description = "Show a hint with the module to import from on unresolved names; press Alt+Enter to import."
type = "bool"
default = true
group = "editor.general.auto-import"
section = "JavaScript and TypeScript"
order = 12

[[plugin.contributions.settings]]
key = "javascript.autoImport.pathStyle"
title = "Use paths relative to"
description = "How completion and Auto Import write the module path of a new import."
type = "enum"
options = [
  { value = "shortest", label = "Shortest path" },
  { value = "project-relative", label = "Project root (or path mapping)" },
  { value = "relative", label = "Current file" },
  { value = "non-relative", label = "Module (non-relative)" },
]
default = "shortest"
group = "editor.general.auto-import"
section = "JavaScript and TypeScript"
order = 13

[[plugin.contributions.settings]]
key = "javascript.autoImport.typeImports"
title = "Use type imports in TypeScript"
description = "Import types with 'import type' when nothing else is imported from the module."
type = "bool"
default = false
group = "editor.general.auto-import"
section = "JavaScript and TypeScript"
order = 14

[[plugin]]
id = "forge.react"
name = "React"
version = "0.1.0"
pack = "webforge"
vendor = "Forge"
depends = ["forge.web"]
description = "JSX components and props: navigation from tags to components and from components to their usages."
projectTypes = ["react", "next"]

[[plugin]]
id = "forge.vue"
name = "Vue.js"
version = "0.1.0"
pack = "webforge"
vendor = "Forge"
depends = ["forge.web"]
description = "Single-file components via the Vue language server, with navigation to components, props and emits."
projectTypes = ["vue", "nuxt"]

[plugin.contributions]
languages = ["vue"]

[[plugin.contributions.lspServers]]
id = "vue-language-server"
languageId = "vue"
command = "vue-language-server"
args = ["--stdio"]
fileExtensions = ["vue"]

[[plugin]]
id = "forge.angular"
name = "Angular"
version = "0.1.0"
pack = "webforge"
vendor = "Forge"
depends = ["forge.web"]
description = "Components, directives and pipes: selector, binding and pipe navigation, template and style line markers."
projectTypes = ["angular"]

[[plugin.contributions.lspServers]]
id = "ngserver"
languageId = "html"
command = "ngserver"
args = ["--stdio"]
fileExtensions = ["html"]

[[plugin.contributions.settings]]
key = "angular.gutterIcons"
title = "Show line markers between components, templates and styles"
type = "bool"
default = true
group = "lang.typescript"
section = "Angular"
order = 10
