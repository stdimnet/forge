# Smaller PHPForge plugins that build on forge.php. Each table is one plugin.

[[plugin]]
id = "forge.composer"
name = "Composer"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php"]
description = "composer.json support, dependency install/update and autoload-aware indexing."
projectTypes = ["composer"]

[[plugin.contributions.commands]]
id = "composer.install"
title = "Composer Install"
category = "Tools"

[[plugin.contributions.commands]]
id = "composer.update"
title = "Composer Update"
category = "Tools"

[[plugin.contributions.settings]]
key = "php.composer.executable"
title = "Path to composer"
description = "A composer executable or composer.phar."
type = "path"
default = "composer"
group = "lang.php.composer"
project = true
order = 0

[[plugin.contributions.settings]]
key = "php.composer.json"
title = "Path to composer.json"
type = "path"
default = "composer.json"
group = "lang.php.composer"
project = true
order = 1

[[plugin.contributions.settings]]
key = "php.composer.syncWithComposerJson"
title = "Synchronize IDE settings with composer.json"
description = "Language level and source roots follow `require.php` and `autoload`."
type = "bool"
default = true
group = "lang.php.composer"
project = true
order = 2

[[plugin.contributions.settings]]
key = "php.composer.addPackagesAsLibraries"
title = "Add packages as libraries"
type = "bool"
default = true
group = "lang.php.composer"
project = true
order = 3

[[plugin.contributions.settings]]
key = "php.composer.checkUpdates"
title = "Check for package updates on project open"
type = "bool"
default = false
group = "lang.php.composer"
order = 4

[[plugin]]
id = "forge.phpunit"
name = "PHPUnit"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php"]
description = "Run, debug and navigate PHPUnit and Pest tests."
projectTypes = ["phpunit", "pest"]

[[plugin.contributions.runConfigurationTypes]]
id = "phpunit"
name = "PHPUnit"
description = "Run a test class, method, directory or phpunit.xml configuration."
icon = "flask-conical"
debuggable = true

[[plugin.contributions.codeGenerators]]
id = "phpunit.testMethod"
title = "Test Method"
languages = ["php"]

[[plugin]]
id = "forge.xdebug"
name = "Xdebug"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php"]
description = "Step debugging with Xdebug 3 via DBGp."
projectTypes = ["php"]

[[plugin.contributions.toolWindows]]
id = "debug"
title = "Debug"
anchor = "bottom"
icon = "bug"
order = 20

[[plugin.contributions.runConfigurationTypes]]
id = "php-remote-debug"
name = "PHP Remote Debug"
description = "Listen for incoming Xdebug connections."
icon = "bug"
debuggable = true

[[plugin]]
id = "forge.laravel"
name = "Laravel"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php", "forge.composer"]
description = "Routes, Blade, Eloquent and artisan integration."
projectTypes = ["laravel"]

[[plugin.contributions.commands]]
id = "laravel.artisan"
title = "Run Artisan Command…"
category = "Tools"

[[plugin.contributions.codeGenerators]]
id = "laravel.model"
title = "Eloquent Model"
languages = ["php"]

[[plugin]]
id = "forge.symfony"
name = "Symfony"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php", "forge.composer"]
description = "Services, routing, Twig templates and console commands."
projectTypes = ["symfony"]

[[plugin.contributions.commands]]
id = "symfony.runConsoleCommand"
title = "Run Console Command…"
category = "Tools"

[[plugin.contributions.commands]]
id = "symfony.refresh"
title = "Refresh Symfony Index"
category = "Tools"

[[plugin.contributions.toolWindows]]
id = "symfony"
title = "Symfony"
anchor = "bottom"
icon = "route"
order = 35

[[plugin.contributions.settings]]
key = "symfony.environment"
title = "Environment"
description = "Kernel environment used for the compiled container and console commands."
type = "enum"
options = [
  { value = "dev", label = "dev" },
  { value = "test", label = "test" },
  { value = "prod", label = "prod" },
]
default = "dev"
group = "lang.php.symfony"
section = "Project"
project = true
order = 0

[[plugin.contributions.settings]]
key = "symfony.appDirectory"
title = "App directory"
description = "Scanned for controllers, console commands and Twig extensions."
type = "path"
default = "src"
group = "lang.php.symfony"
section = "Project"
project = true
order = 1

[[plugin.contributions.settings]]
key = "symfony.templatesDirectory"
title = "Templates directory"
type = "path"
default = "templates"
group = "lang.php.symfony"
section = "Project"
project = true
order = 2

[[plugin.contributions.settings]]
key = "symfony.consolePath"
title = "Console"
description = "Path to the console script, relative to the project root."
type = "path"
default = "bin/console"
group = "lang.php.symfony"
section = "Project"
project = true
order = 3

[[plugin.contributions.settings]]
key = "symfony.containerXml"
title = "Container XML"
description = "Compiled container dump; leave empty to use var/cache/<environment>/*Container.xml."
type = "path"
default = ""
group = "lang.php.symfony"
section = "Container"
project = true
order = 10

[[plugin.contributions.settings]]
key = "symfony.gutterIcons"
title = "Show line markers for routes, templates and commands"
type = "bool"
default = true
group = "lang.php.symfony"
section = "Editor"
order = 20

[[plugin.contributions.settings]]
key = "symfony.twigCompletion"
title = "Complete Twig tags, filters and functions"
type = "bool"
default = true
group = "lang.php.symfony"
section = "Editor"
order = 21

[[plugin]]
id = "forge.doctrine"
name = "Doctrine"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php"]
description = "Entity mapping, repositories and DQL completion."
projectTypes = ["doctrine"]

[[plugin.contributions.commands]]
id = "doctrine.refresh"
title = "Refresh Doctrine Entities"
category = "Tools"

[[plugin.contributions.toolWindows]]
id = "doctrine"
title = "Doctrine"
anchor = "right"
icon = "boxes"
order = 15

[[plugin.contributions.settings]]
key = "doctrine.sourceDirectories"
title = "Entity source directories"
description = "Scanned for #[ORM\\Entity] classes and repositories."
type = "list"
default = ["src"]
group = "lang.php.doctrine"
section = "Mapping"
project = true
order = 0

[[plugin.contributions.settings]]
key = "doctrine.mappingDirectories"
title = "Mapping file directories"
description = "Directories with *.orm.xml and *.orm.yml mapping files."
type = "list"
default = ["config/doctrine", "src/Resources/config/doctrine"]
group = "lang.php.doctrine"
section = "Mapping"
project = true
order = 1

[[plugin.contributions.settings]]
key = "doctrine.annotations"
title = "Read legacy @ORM annotations"
description = "Docblock annotations are used when a class has no mapping attributes."
type = "bool"
default = true
group = "lang.php.doctrine"
section = "Mapping"
project = true
order = 2

[[plugin.contributions.settings]]
key = "doctrine.dqlInjection"
title = "Highlight DQL in createQuery() and QueryBuilder strings"
type = "bool"
default = true
group = "lang.php.doctrine"
section = "DQL"
order = 10

[[plugin.contributions.settings]]
key = "doctrine.dqlCompletion"
title = "Complete entities, aliases and fields in DQL"
type = "bool"
default = true
group = "lang.php.doctrine"
section = "DQL"
order = 11

[[plugin.contributions.settings]]
key = "doctrine.dqlInspections"
title = "Report unknown entities and fields"
type = "bool"
default = true
group = "lang.php.doctrine"
section = "DQL"
order = 12
