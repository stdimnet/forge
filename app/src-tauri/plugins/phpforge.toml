# Smaller PHPForge plugins that build on forge.php. Each table is one plugin.

[[plugin]]
id = "forge.composer"
name = "Composer"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php"]
description = "composer.json support, dependency install/update and autoload-aware indexing."
projectTypes = ["composer"]

[[plugin.contributions.commands]]
id = "Composer.AddDependency"
title = "Add Dependency…"
category = "Composer"

[[plugin.contributions.commands]]
id = "Composer.Install"
title = "Install"
category = "Composer"

[[plugin.contributions.commands]]
id = "Composer.Update"
title = "Update"
category = "Composer"

[[plugin.contributions.commands]]
id = "Composer.Validate"
title = "Validate"
category = "Composer"

[[plugin.contributions.commands]]
id = "Composer.ShowOutdated"
title = "Show Outdated"
category = "Composer"

[[plugin.contributions.commands]]
id = "Composer.Audit"
title = "Audit"
category = "Composer"

[[plugin.contributions.mainMenu]]
path = "Tools/_Composer"
items = [
  { type = "action", id = "Composer.AddDependency", label = "_Add Dependency..." },
  { type = "separator" },
  { type = "action", id = "Composer.Install", label = "_Install" },
  { type = "action", id = "Composer.Update", label = "_Update" },
  { type = "action", id = "Composer.Validate", label = "_Validate" },
  { type = "action", id = "Composer.ShowOutdated", label = "Show _Outdated" },
  { type = "action", id = "Composer.Audit", label = "Au_dit" },
]

[[plugin.contributions.runConfigurationTypes]]
id = "composer"
name = "Composer Script"
description = "Run a script from composer.json."
icon = "package"

[[plugin.contributions.settings]]
key = "php.composer.executable"
title = "Path to composer"
description = "A composer executable, or a composer.phar (run with the PHP interpreter of Settings | PHP). Empty: `composer` from PATH."
type = "path"
default = "composer"
group = "lang.php.composer"
section = "Execution"
project = true
order = 1

[[plugin.contributions.settings]]
key = "php.composer.json"
title = "Path to composer.json"
description = "Relative to the project root."
type = "path"
default = "composer.json"
group = "lang.php.composer"
project = true
order = 0

[[plugin.contributions.settings]]
key = "php.composer.syncWithComposerJson"
title = "Synchronize IDE settings with composer.json"
description = "The PHP language level follows `require.php` of composer.json (the status bar shows it); the language level setting applies when there is no constraint."
type = "bool"
default = true
group = "lang.php.composer"
project = true
order = 2

[[plugin.contributions.settings]]
key = "php.composer.addPackagesAsLibraries"
title = "Add packages as libraries"
description = "Classes in vendor/ are resolved for navigation, completion and Intelephense. Off: vendor/ is left out."
type = "bool"
default = true
group = "lang.php.composer"
project = true
order = 3

[[plugin.contributions.settings]]
key = "php.composer.checkUpdates"
title = "Check for package updates on project open"
description = "Runs `composer outdated --direct` on the project's machine and reports updates in a balloon."
type = "bool"
default = false
group = "lang.php.composer"
order = 4

[[plugin.contributions.settings]]
key = "php.composer.packagist"
title = "Use Packagist for completion, versions and outdated packages"
description = "Package names, versions and descriptions come from packagist.org (cached in Forge's cache directory). Off: only installed packages are used and Forge never contacts Packagist."
type = "bool"
default = true
group = "lang.php.composer"
order = 5

[[plugin.contributions.inspections]]
id = "ComposerOutdatedPackages"
name = "Outdated Composer packages"
group = "PHP/Composer"
language = "json"
severity = "WEAK WARNING"
external = true
batch = false
description = "Dependencies of composer.json with a newer version available."

[[plugin.contributions.inspectionMappings]]
source = "composer-outdated"
inspection = "ComposerOutdatedPackages"

[[plugin]]
id = "forge.command-line-tools"
name = "Command Line Tool Support"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php"]
description = "Run Composer, Laravel Artisan, Symfony Console, WP-CLI, Drush and custom tools in a console with command, option and argument completion (Tools | Run Command…, Ctrl+Shift+X)."
projectTypes = ["php", "composer"]

[[plugin.contributions.commands]]
id = "CommandLineToolsAction"
title = "Run Command…"
category = "Tools"

[[plugin.contributions.keybindings]]
command = "CommandLineToolsAction"
key = "Ctrl+Shift+X"

[[plugin.contributions.mainMenu]]
path = "Tools"
after = "RunAnything"
items = [
  { type = "action", id = "CommandLineToolsAction", label = "Run _Command..." },
]

[[plugin.contributions.toolWindows]]
id = "commandLineTools"
title = "Command Line Tools Console"
anchor = "bottom"
icon = "square-terminal"
order = 45

[[plugin.contributions.settings]]
key = "commandLineTools.tools"
title = "Command line tools"
description = "Tools that Tools | Run Command… (Ctrl+Shift+X) runs. The alias starts the command line, e.g. c install or a make:model Order. Tools run with the PHP interpreter of the project unless they name another one."
type = "objects"
unique = ["alias"]
default = []
group = "tools.command-line-tools"
project = true
order = 0

[[plugin.contributions.settings]]
key = "commandLineTools.autoDetect"
title = "Add the tools the project uses automatically"
description = "Composer (composer.json), Laravel Artisan (artisan), Symfony Console (bin/console), WP-CLI (wp-cli.phar, vendor/bin/wp or a WordPress site) and Drush (vendor/bin/drush), unless a tool of that kind or alias is configured."
type = "bool"
default = true
group = "tools.command-line-tools"
project = true
order = 1

