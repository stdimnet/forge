# Smaller PHPForge plugins that build on forge.php. Each table is one plugin.

[[plugin]]
id = "forge.composer"
name = "Composer"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php"]
description = "composer.json support, dependency install/update and autoload-aware indexing."
projectTypes = ["composer"]

[[plugin.contributions.commands]]
id = "composer.install"
title = "Composer Install"
category = "Tools"

[[plugin.contributions.commands]]
id = "composer.update"
title = "Composer Update"
category = "Tools"

[[plugin.contributions.runConfigurationTypes]]
id = "composer"
name = "Composer Script"
description = "Run a script from composer.json."
icon = "package"

[[plugin.contributions.settings]]
key = "php.composer.executable"
title = "Path to composer"
description = "A composer executable or composer.phar."
type = "path"
default = "composer"
group = "lang.php.composer"
project = true
order = 0

[[plugin.contributions.settings]]
key = "php.composer.json"
title = "Path to composer.json"
type = "path"
default = "composer.json"
group = "lang.php.composer"
project = true
order = 1

[[plugin.contributions.settings]]
key = "php.composer.syncWithComposerJson"
title = "Synchronize IDE settings with composer.json"
description = "Language level and source roots follow `require.php` and `autoload`."
type = "bool"
default = true
group = "lang.php.composer"
project = true
order = 2

[[plugin.contributions.settings]]
key = "php.composer.addPackagesAsLibraries"
title = "Add packages as libraries"
type = "bool"
default = true
group = "lang.php.composer"
project = true
order = 3

[[plugin.contributions.settings]]
key = "php.composer.checkUpdates"
title = "Check for package updates on project open"
type = "bool"
default = false
group = "lang.php.composer"
order = 4

[[plugin]]
id = "forge.phpunit"
name = "PHPUnit"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php"]
description = "Run, debug and navigate PHPUnit and Pest tests."
projectTypes = ["phpunit", "pest"]

[[plugin.contributions.runConfigurationTypes]]
id = "phpunit"
name = "PHPUnit"
description = "Run a test class, method, directory or phpunit.xml configuration."
icon = "flask-conical"
debuggable = true

[[plugin.contributions.codeGenerators]]
id = "phpunit.testMethod"
title = "Test Method"
languages = ["php"]

[[plugin]]
id = "forge.xdebug"
name = "Xdebug"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php"]
description = "Step debugging with Xdebug 3 via DBGp."
projectTypes = ["php"]

[[plugin.contributions.toolWindows]]
id = "debug"
title = "Debug"
anchor = "bottom"
icon = "bug"
order = 20

[[plugin.contributions.runConfigurationTypes]]
id = "php-remote-debug"
name = "PHP Remote Debug"
description = "Listen for incoming Xdebug connections."
icon = "bug"
debuggable = true

[[plugin.contributions.commands]]
id = "PhpListenDebugAction"
title = "Start Listening for PHP Debug Connections"
category = "Run"

# ---- Languages & Frameworks > PHP > Debug ----------------------------------------------

[[plugin.contributions.settings]]
key = "php.debug.port"
title = "Debug port"
description = "Forge listens here for Xdebug (xdebug.client_port, 9003 by default)."
type = "int"
min = 1
max = 65535
default = 9003
group = "lang.php.debug"
section = "Xdebug"
order = 0

[[plugin.contributions.settings]]
key = "php.debug.ignoreExternalConnections"
title = "Ignore external connections through unregistered server configurations"
description = "Connections that match no server and no project file are detached silently."
type = "bool"
default = false
group = "lang.php.debug"
section = "Xdebug"
order = 1

[[plugin.contributions.settings]]
key = "php.debug.breakAtFirstLine"
title = "Break at first line in PHP scripts"
type = "bool"
default = false
group = "lang.php.debug"
section = "Settings"
order = 10

[[plugin.contributions.settings]]
key = "php.debug.ignoreUnmappedFiles"
title = "Step out of files that are not mapped into the project"
description = "Stepping never stops in code without a local file (e.g. PHAR internals or eval'd code)."
type = "bool"
default = true
group = "lang.php.debug"
section = "Settings"
order = 11

[[plugin.contributions.settings]]
key = "php.debug.showInlineValues"
title = "Show variable values in editor while debugging"
type = "bool"
default = true
group = "lang.php.debug"
section = "Settings"
order = 12

[[plugin.contributions.settings]]
key = "php.debug.maxChildren"
title = "Max. children"
description = "Array elements and object properties loaded per page."
type = "int"
min = 1
max = 10000
default = 100
group = "lang.php.debug"
section = "Evaluation"
order = 20

[[plugin.contributions.settings]]
key = "php.debug.maxDepth"
title = "Max. depth"
description = "Nesting levels fetched at once; deeper levels load when expanded."
type = "int"
min = 1
max = 16
default = 1
group = "lang.php.debug"
section = "Evaluation"
order = 21

[[plugin.contributions.settings]]
key = "php.debug.maxData"
title = "Max. string length"
description = "Bytes of string data fetched per value."
type = "int"
min = 128
max = 10485760
default = 65536
group = "lang.php.debug"
section = "Evaluation"
order = 22

[[plugin]]
id = "forge.laravel"
name = "Laravel"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php", "forge.composer"]
description = "Routes, Blade, Eloquent and artisan integration."
projectTypes = ["laravel"]

[[plugin.contributions.commands]]
id = "Laravel.RunArtisan"
title = "Run Artisan Command…"
category = "Tools"

[[plugin.contributions.runConfigurationTypes]]
id = "artisan"
name = "Artisan"
description = "Run an artisan command of a Laravel application."
icon = "terminal"
debuggable = true

[[plugin.contributions.codeGenerators]]
id = "laravel.model"
title = "Eloquent Model"
languages = ["php"]

[[plugin.contributions.toolWindows]]
id = "laravel.routes"
title = "Routes"
anchor = "bottom"
icon = "route"
order = 35

[[plugin.contributions.keybindings]]
command = "Laravel.RunArtisan"
key = "Ctrl+Shift+X"

[[plugin.contributions.settings]]
key = "laravel.routes.source"
title = "Read routes from"
description = "php artisan route:list also sees routes registered by packages, but needs a bootable application."
type = "enum"
options = [
  { value = "auto", label = "artisan route:list when available, else route files" },
  { value = "artisan", label = "artisan route:list" },
  { value = "static", label = "Route files (no PHP needed)" },
]
default = "auto"
group = "lang.php.laravel"
section = "Routes"
project = true
order = 0

[[plugin.contributions.settings]]
key = "laravel.completion.enabled"
title = "Complete routes, views, config, translations and model attributes"
type = "bool"
default = true
group = "lang.php.laravel"
section = "Code Completion"
order = 10

[[plugin.contributions.settings]]
key = "laravel.completion.columns"
title = "Complete database columns in query builder calls"
description = "where(), orderBy(), pluck() and similar, with columns read from the migrations."
type = "bool"
default = true
group = "lang.php.laravel"
section = "Code Completion"
order = 11

[[plugin.contributions.settings]]
key = "laravel.gutter.routes"
title = "Show route icons for controller actions"
type = "bool"
default = true
group = "lang.php.laravel"
section = "Gutter Icons"
order = 20

[[plugin.contributions.settings]]
key = "laravel.gutter.views"
title = "Show view icons for view() calls and Blade includes"
type = "bool"
default = true
group = "lang.php.laravel"
section = "Gutter Icons"
order = 21

[[plugin.contributions.settings]]
key = "laravel.blade.customDirectives"
title = "Additional Blade directives"
description = "Directive names without @, e.g. datetime. They are highlighted and completed like built-in ones."
type = "list"
default = []
group = "lang.php.laravel"
section = "Blade"
project = true
order = 30

