[[plugin]]
id = "forge.cms"
name = "Drupal, Joomla and Shopware"
version = "0.1.0"
pack = "phpforge"
vendor = "Forge"
depends = ["forge.php", "forge.command-line-tools"]
description = "CMS basics: detection, Drupal's .module/.install/.theme/.inc files as PHP, Drupal hook completion with Go to the hook docs, Shopware's Twig tags and Smarty templates, Joomla manifests, Drush and Shopware console runners."
projectTypes = ["drupal", "joomla", "shopware"]

[[plugin.contributions.fileTypes]]
id = "php"
name = "PHP"
extensions = ["php", "phtml", "inc", "module", "install", "theme", "profile", "engine"]

[[plugin.contributions.commands]]
id = "Cms.RunDrush"
title = "Drush…"
category = "Tools"

[[plugin.contributions.commands]]
id = "Cms.RunShopwareConsole"
title = "Shopware Console…"
category = "Tools"

[[plugin.contributions.mainMenu]]
path = "Tools"
after = "CommandLineToolsAction"
items = [
  { type = "action", id = "Cms.RunDrush", label = "_Drush..." },
  { type = "action", id = "Cms.RunShopwareConsole", label = "Shopware _Console..." },
]

[[plugin.contributions.settings]]
key = "cms.drupal.hookCompletion"
title = "Complete Drupal hook implementations"
description = "After `function` in .module, .install, .theme, .profile and .inc files: `<module>_<hook>` with the hook's parameters."
type = "bool"
default = true
group = "lang.php.cms"
section = "Drupal"
order = 0

[[plugin.contributions.settings]]
key = "cms.drupal.gutterIcons"
title = "Show gutter icons for hook implementations"
description = "Clicking one opens the hook's documentation: its `hook_…` function in the project's *.api.php files, else api.drupal.org."
type = "bool"
default = true
group = "lang.php.cms"
section = "Drupal"
order = 1
