[[plugin.contributions.runConfigurationTypes]]
id = "tox"
name = "tox"
description = "Run tox environments; every environment is a test of the tree."
icon = "box"

# debugpy (MIT). Run configurations debug through `python -m debugpy --listen`, so Docker,
# SSH and WSL interpreters work; Attach to Process starts the adapter
# (`python -m debugpy.adapter`) with the project's interpreter.
[[plugin.contributions.debugAdapters]]
type = "python"
label = "Python (debugpy)"
command = "python3"
args = ["-m", "debugpy.adapter"]
languages = ["py", "pyw"]
launch = { program = "${program}", args = "${args}", cwd = "${cwd}", env = "${env}", stopOnEntry = "${stopOnEntry}", console = "internalConsole", justMyCode = true }
attach = { processId = "${pid}", justMyCode = true }
attachSchema = { type = "object", properties = { justMyCode = { type = "boolean", description = "Step only through the project's code" }, pathMappings = { type = "array", description = "[{ \"localRoot\": \"…\", \"remoteRoot\": \"…\" }] for programs in containers or on other hosts" } } }

