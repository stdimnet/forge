# ---- Tests, debugger, console and profiler (packs/pyforge/testing) ------------------------

[[plugin]]
id = "forge.python-tools"
name = "Python Tests, Debugger, Console and Profiler"
version = "0.1.0"
pack = "pyforge"
vendor = "Forge"
depends = ["forge.python-env"]
projectTypes = ["pyforge"]
description = "pytest, unittest and tox in the test runner (gutter icons, Rerun Failed Tests, coverage with pytest-cov), debugging with debugpy (launch, Attach to Process, Attach to DAP Server, the debug console), the Python Console with IPython and a variables view, and the cProfile profiler with call tree and hot spots."

[[plugin.contributions.toolWindows]]
id = "pythonConsole"
title = "Python Console"
anchor = "bottom"
icon = "square-terminal"
order = 46

[[plugin.contributions.toolWindows]]
id = "profiler"
title = "Profiler"
anchor = "bottom"
icon = "gauge"
order = 47

[[plugin.contributions.commands]]
id = "ExecuteInPyConsoleAction"
title = "Run Selection in Python Console"
category = "Python"

[[plugin.contributions.commands]]
id = "RunFileInPythonConsole"
title = "Run File in Python Console"
category = "Python"

[[plugin.contributions.commands]]
id = "ActivatePythonConsoleToolWindow"
title = "Python Console"
category = "View"

[[plugin.contributions.commands]]
id = "python.profile"
title = "Profile"
category = "Run"

[[plugin.contributions.commands]]
id = "python.runToxEnvironment"
title = "Run tox Environment…"
category = "Python"

[[plugin.contributions.runConfigurationTypes]]
id = "pytest"
name = "pytest"
description = "Run pytest: a directory, a file, a class, a test or parametrized case, or tests matching a keyword (-k)."
icon = "flask-conical"

[[plugin.contributions.runConfigurationTypes]]
id = "unittest"
name = "Unittests"
description = "Run unittest test cases: discovery in a directory, a file, a class or a test method."
icon = "test-tube-diagonal"

[[plugin.contributions.runConfigurationTypes]]
id = "tox"
name = "tox"
description = "Run tox environments; every environment is a test of the tree."
icon = "box"

# debugpy (MIT). Run configurations debug through `python -m debugpy --listen`, so Docker,
# SSH and WSL interpreters work; Attach to Process starts the adapter
# (`python -m debugpy.adapter`) with the project's interpreter.
[[plugin.contributions.debugAdapters]]
type = "python"
label = "Python (debugpy)"
command = "python3"
args = ["-m", "debugpy.adapter"]
languages = ["py", "pyw"]
launch = { program = "${program}", args = "${args}", cwd = "${cwd}", env = "${env}", stopOnEntry = "${stopOnEntry}", console = "internalConsole", justMyCode = true }
attach = { processId = "${pid}", justMyCode = true }
attachSchema = { type = "object", properties = { justMyCode = { type = "boolean", description = "Step only through the project's code" }, pathMappings = { type = "array", description = "[{ \"localRoot\": \"…\", \"remoteRoot\": \"…\" }] for programs in containers or on other hosts" } } }

# ---- Settings | Tools | Python Integrated Tools ------------------------------------------

[[plugin.contributions.settings]]
key = "python.testing.runner"
title = "Default test runner"
description = "Runs tests from the gutter and Run Context Configuration. Autodetect: pytest when the project uses it (configuration or dependency), unittest for files with only test cases."
type = "enum"
options = [
  { value = "auto", label = "Autodetect" },
  { value = "pytest", label = "pytest" },
  { value = "unittest", label = "Unittests" },
]
default = "auto"
group = "tools.python-integrated-tools"
section = "Testing"
project = true
order = 0

[[plugin.contributions.settings]]
key = "python.pytest.reporter"
title = "pytest results"
description = "JUnit XML is built into pytest; a report log needs the pytest-reportlog plugin."
type = "enum"
options = [
  { value = "junitxml", label = "JUnit XML (--junitxml)" },
  { value = "reportLog", label = "Report log (--report-log)" },
]
default = "junitxml"
group = "tools.python-integrated-tools"
section = "Testing"
project = true
order = 1

[[plugin.contributions.settings]]
key = "python.tox.path"
title = "tox executable"
description = "Leave empty to run tox with the project's interpreter (python -m tox)."
type = "path"
default = ""
group = "tools.python-integrated-tools"
section = "tox"
order = 10

