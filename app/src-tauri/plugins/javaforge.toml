# ---- Settings | Languages & Frameworks | Java ------------------------------------------

[[contributions.settings]]
key = "java.jdtls.autoInstall"
title = "Install Eclipse JDT LS"
description = "When a Java project opens without the language server: ask, install it from download.eclipse.org, or never."
type = "enum"
options = [
  { value = "ask", label = "Ask" },
  { value = "always", label = "Always" },
  { value = "never", label = "Never" },
]
default = "ask"
group = "lang.java"
section = "Eclipse JDT Language Server"
order = 0

[[contributions.settings]]
key = "java.jdtls.path"
title = "JDT LS installation"
description = "A folder with an unpacked JDT LS (plugins/, config_*/). Empty: the one Forge installed."
type = "path"
default = ""
group = "lang.java"
section = "Eclipse JDT Language Server"
order = 1

[[contributions.settings]]
key = "java.jdtls.jdk"
title = "JDK for the language server"
description = "JDT LS needs Java 21 or newer (Java 25 for releases since 2026). Empty: the project JDK when it is new enough, else the newest detected JDK that is."
type = "path"
default = ""
group = "lang.java"
section = "Eclipse JDT Language Server"
order = 2

[[contributions.settings]]
key = "java.jdtls.vmOptions"
title = "VM options"
