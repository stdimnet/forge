type = "enum"
options = [
  { value = "milestones", label = "Milestones" },
  { value = "snapshots", label = "Snapshots" },
]
default = "milestones"
group = "lang.java"
section = "Eclipse JDT Language Server"
order = 4

[[contributions.settings]]
key = "java.jdtls.downloadSite"
title = "Download site"
type = "string"
