# WebForge plugins, plus the AI plugins that ship with the core. Each table is one plugin.

[[plugin]]
id = "forge.web"
name = "HTML, CSS & JavaScript"
version = "0.1.0"
pack = "webforge"
vendor = "Forge"
description = "HTML, CSS, JavaScript and TypeScript editing with language servers."
projectTypes = ["webforge"]

[plugin.contributions]
languages = ["html", "css", "scss", "js", "mjs", "ts", "tsx", "jsx"]

[[plugin.contributions.lspServers]]
id = "typescript-language-server"
languageId = "typescript"
command = "typescript-language-server"
args = ["--stdio"]
fileExtensions = ["js", "mjs", "cjs", "jsx", "ts", "tsx"]

[[plugin.contributions.lspServers]]
id = "vscode-css-language-server"
languageId = "css"
command = "vscode-css-language-server"
args = ["--stdio"]
fileExtensions = ["css", "scss", "less"]

[[plugin.contributions.lspServers]]
id = "vscode-html-language-server"
languageId = "html"
command = "vscode-html-language-server"
args = ["--stdio"]
fileExtensions = ["html", "htm"]

[[plugin.contributions.runConfigurationTypes]]
id = "npm"
name = "npm"
description = "Run a package.json script."
icon = "package"

[[plugin]]
id = "forge.vue"
name = "Vue.js"
version = "0.1.0"
pack = "webforge"
vendor = "Forge"
depends = ["forge.web"]
description = "Single-file components via the Vue language server."
projectTypes = ["vue", "nuxt"]

[plugin.contributions]
languages = ["vue"]

[[plugin.contributions.lspServers]]
id = "vue-language-server"
languageId = "vue"
command = "vue-language-server"
args = ["--stdio"]
fileExtensions = ["vue"]

[[plugin]]
id = "forge.ai"
name = "AI Assistant"
version = "0.1.0"
pack = "core"
vendor = "Forge"
description = "Chat, inline completions and code generation with your own model providers."

[[plugin.contributions.toolWindows]]
id = "ai-chat"
title = "AI Chat"
anchor = "right"
icon = "sparkles"

[[plugin.contributions.aiProviders]]
id = "anthropic"
name = "Anthropic"
kind = "anthropic"
baseUrl = "https://api.anthropic.com"
requiresApiKey = true

[[plugin.contributions.aiProviders]]
id = "openai-compatible"
name = "OpenAI-compatible"
kind = "openai-compatible"
requiresApiKey = true

[[plugin.contributions.aiProviders]]
id = "gemini"
name = "Google Gemini"
kind = "gemini"
requiresApiKey = true

[[plugin.contributions.chatAgents]]
id = "assistant"
name = "Assistant"
description = "General chat about the open project."

[[plugin.contributions.codeGenerators]]
id = "ai.generateTests"
title = "Tests with AI"
languages = ["php", "typescript", "lua"]

[[plugin.contributions.codeGenerators]]
id = "ai.generateDocs"
title = "Documentation with AI"
languages = ["php", "typescript", "lua"]

[[plugin]]
id = "forge.claude-code"
name = "Claude Code"
version = "0.1.0"
pack = "core"
vendor = "Forge"
depends = ["forge.ai"]
description = "Run Claude Code agents in the IDE, several in parallel."

[[plugin.contributions.aiProviders]]
id = "claude-code"
name = "Claude Code CLI"
kind = "cli"

[[plugin.contributions.chatAgents]]
id = "claude-code"
name = "Claude Code"
description = "Agentic coding in your project, using the local `claude` CLI."
provider = "claude-code"

# ---- Tools > AI Agents ---------------------------------------------------------------

[[plugin.contributions.settings]]
key = "agents.claude-code.path"
title = "Claude Code executable"
description = "Leave empty to find claude on PATH."
type = "path"
default = ""
group = "tools.ai-agents"
section = "Claude Code"
order = 0

[[plugin.contributions.settings]]
key = "agents.claude-code.model"
title = "Default model"
type = "enum"
options = [
  { value = "default", label = "Default (CLI setting)" },
  { value = "sonnet", label = "Sonnet" },
  { value = "opus", label = "Opus" },
  { value = "haiku", label = "Haiku" },
]
default = "default"
group = "tools.ai-agents"
section = "Claude Code"
order = 1

[[plugin.contributions.settings]]
key = "agents.claude-code.permissionMode"
title = "Default permission mode"
description = "How much the agent may do before asking. Can be changed per chat."
type = "enum"
options = [
  { value = "default", label = "Ask before edits and commands" },
  { value = "acceptEdits", label = "Auto-accept edits" },
  { value = "plan", label = "Plan mode (read-only)" },
  { value = "bypassPermissions", label = "Bypass permissions" },
]
default = "default"
group = "tools.ai-agents"
section = "Claude Code"
order = 2

