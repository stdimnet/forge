# The AI plugins that ship with the core. Each table is one plugin.

[[plugin]]
id = "forge.ai"
name = "AI Assistant"
version = "0.1.0"
pack = "core"
vendor = "Forge"
description = "Chat, inline completions and code generation with your own model providers."

[[plugin.contributions.toolWindows]]
id = "ai-chat"
title = "AI Chat"
anchor = "right"
icon = "sparkles"

[[plugin.contributions.aiProviders]]
id = "anthropic"
name = "Anthropic"
kind = "anthropic"
baseUrl = "https://api.anthropic.com"
requiresApiKey = true

[[plugin.contributions.aiProviders]]
id = "openai-compatible"
name = "OpenAI-compatible"
kind = "openai-compatible"
requiresApiKey = true

[[plugin.contributions.aiProviders]]
id = "gemini"
name = "Google Gemini"
kind = "gemini"
requiresApiKey = true

[[plugin.contributions.chatAgents]]
id = "assistant"
name = "Assistant"
description = "General chat about the open project."

[[plugin.contributions.codeGenerators]]
id = "ai.generateTests"
title = "Tests with AI"
languages = ["php", "typescript", "lua"]

[[plugin.contributions.codeGenerators]]
id = "ai.generateDocs"
title = "Documentation with AI"
languages = ["php", "typescript", "lua"]

# ---- Tools > AI Assistant (AI in the editor) -----------------------------------------

[[plugin.contributions.settings]]
key = "ai.enabled"
title = "Enable AI features in this project"
description = "Turn off to keep this project's code away from all AI providers: no inline completion, no Explain / Fix / Generate with AI. Files can also be excluded with an .aiignore file in the project root (gitignore syntax)."
type = "bool"
default = true
project = true
group = "tools.ai-assistant"
section = "General"
order = 0

[[plugin.contributions.settings]]
key = "ai.completion.enabled"
title = "Enable inline code completion"
description = "Show AI suggestions as gray text while you type. Tab accepts, Ctrl+Right accepts the next word, Escape dismisses. Uses the Code completion model of Settings | Tools | AI Providers."
type = "bool"
default = false
group = "tools.ai-assistant"
section = "Inline Completion"
order = 10

[[plugin.contributions.settings]]
key = "ai.completion.multiline"
title = "Suggestion length"
description = "Automatic suggests several lines on an empty line and after a block opener such as `{`, else one line."
type = "enum"
options = [
  { value = "auto", label = "Automatic" },
  { value = "single", label = "Single line" },
  { value = "multi", label = "Multi-line" },
]
default = "auto"
group = "tools.ai-assistant"
section = "Inline Completion"
order = 11

[[plugin.contributions.settings]]
key = "ai.completion.mode"
title = "Request type"
description = "Fill-in-the-middle sends the code before and after the caret to the server's completions endpoint (code models on Ollama, LM Studio, llama.cpp). Chat asks a chat model (Anthropic, OpenAI, OpenRouter). Automatic picks fill-in-the-middle for local servers and chat for hosted APIs."
type = "enum"
options = [
  { value = "auto", label = "Automatic" },
  { value = "fim", label = "Fill-in-the-middle" },
  { value = "chat", label = "Chat" },
]
default = "auto"
group = "tools.ai-assistant"
section = "Inline Completion"
order = 12

[[plugin.contributions.settings]]
key = "ai.completion.debounceMs"
title = "Delay before asking (ms)"
description = "How long typing must pause before a suggestion is requested."
type = "int"
default = 350
min = 50
max = 3000
group = "tools.ai-assistant"
section = "Inline Completion"
order = 13

[[plugin.contributions.settings]]
key = "ai.completion.disabledLanguages"
title = "Disable for languages"
description = "Language ids without inline completion, e.g. markdown, text, json, yaml, php, typescript."
type = "list"
default = []
group = "tools.ai-assistant"
section = "Inline Completion"
order = 14

[[plugin]]
id = "forge.claude-code"
name = "Claude Code"
version = "0.1.0"
pack = "core"
vendor = "Forge"
depends = ["forge.ai"]
description = "Run Claude Code agents in the IDE, several in parallel."

[[plugin.contributions.aiProviders]]
id = "claude-code"
name = "Claude Code CLI"
kind = "cli"

[[plugin.contributions.chatAgents]]
id = "claude-code"
name = "Claude Code"
description = "Agentic coding in your project, using the local `claude` CLI."
provider = "claude-code"

# ---- Tools > AI Agents ---------------------------------------------------------------

[[plugin.contributions.settings]]
key = "agents.claude-code.path"
title = "Claude Code executable"
description = "Leave empty to find claude on PATH."
type = "path"
default = ""
group = "tools.ai-agents"
section = "Claude Code"
order = 0

[[plugin.contributions.settings]]
key = "agents.claude-code.model"
title = "Default model"
type = "enum"
options = [
  { value = "default", label = "Default (CLI setting)" },
  { value = "sonnet", label = "Sonnet" },
  { value = "opus", label = "Opus" },
  { value = "haiku", label = "Haiku" },
]
default = "default"
group = "tools.ai-agents"
section = "Claude Code"
order = 1

[[plugin.contributions.settings]]
key = "agents.claude-code.permissionMode"
title = "Default permission mode"
description = "How much the agent may do before asking. Can be changed per chat."
type = "enum"
options = [
  { value = "default", label = "Ask before edits and commands" },
  { value = "acceptEdits", label = "Auto-accept edits" },
  { value = "plan", label = "Plan mode (read-only)" },
  { value = "bypassPermissions", label = "Bypass permissions" },
]
default = "default"
group = "tools.ai-agents"
section = "Claude Code"
order = 2

[[plugin]]
id = "forge.gemini-cli"
name = "Gemini CLI"
version = "0.1.0"
pack = "core"
vendor = "Forge"
depends = ["forge.ai"]
description = "Chat with Gemini CLI agents in the IDE, using your own Gemini CLI login."

[[plugin.contributions.aiProviders]]
id = "gemini-cli"
name = "Gemini CLI"
kind = "cli"

[[plugin.contributions.chatAgents]]
id = "gemini-cli"
name = "Gemini CLI"
description = "Agentic coding in your project, using the local `gemini` CLI."
provider = "gemini-cli"

[[plugin.contributions.settings]]
key = "agents.gemini-cli.path"
title = "Gemini CLI executable"
description = "Leave empty to find gemini on PATH."
type = "path"
default = ""
group = "tools.ai-agents"
section = "Gemini CLI"
order = 10

[[plugin.contributions.settings]]
key = "agents.gemini-cli.model"
title = "Default model"
type = "enum"
options = [
  { value = "default", label = "Default (CLI setting)" },
  { value = "gemini-2.5-pro", label = "Gemini 2.5 Pro" },
  { value = "gemini-2.5-flash", label = "Gemini 2.5 Flash" },
  { value = "gemini-2.5-flash-lite", label = "Gemini 2.5 Flash-Lite" },
]
default = "default"
group = "tools.ai-agents"
section = "Gemini CLI"
order = 11

[[plugin.contributions.settings]]
key = "agents.gemini-cli.permissionMode"
title = "Default approval mode"
description = "Gemini CLI cannot ask in the IDE, so the mode decides which tools it may use. Can be changed per chat."
type = "enum"
options = [
  { value = "default", label = "Read-only (no edits or commands)" },
  { value = "acceptEdits", label = "Auto-accept edits (no commands)" },
  { value = "bypassPermissions", label = "YOLO (edits and commands without asking)" },
]
default = "default"
group = "tools.ai-agents"
section = "Gemini CLI"
order = 12
