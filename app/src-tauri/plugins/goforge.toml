[[plugin.contributions.inspections]]
id = "GoVet"
name = "go vet"
group = "Go/External tools"
language = "go"
severity = "WARNING"
external = true
batch = false
description = "Problems reported by go vet."

[[plugin.contributions.inspections]]
id = "GolangciLint"
name = "golangci-lint"
group = "Go/External tools"
language = "go"
severity = "WARNING"
external = true
batch = false
description = "Problems reported by golangci-lint; they keep the linter's level until the profile sets a severity."

[[plugin.contributions.inspectionMappings]]
source = "go-vet"
inspection = "GoVet"

[[plugin.contributions.inspectionMappings]]
source = "golangci-lint"
inspection = "GolangciLint"
