description = "The Go SDK of the project. Empty: the newest SDK Forge finds (PATH, /usr/local/go, ~/sdk, Homebrew, Program Files, Forge's downloads)."
type = "path"
default = ""
group = "lang.go"
section = "GOROOT"
project = true
hidden = true
order = 0

[[plugin.contributions.settings]]
key = "go.gopath"
title = "Project GOPATH"
description = "GOPATH for builds, runs and tests of this project. Empty: Go's default (GOPATH or ~/go)."
type = "path"
default = ""
group = "lang.go"
section = "GOPATH"
project = true
order = 10

[[plugin.contributions.settings]]
key = "go.goflags"
title = "GOFLAGS"
description = "Flags every go command of the project gets, e.g. -mod=mod or -buildvcs=false."
