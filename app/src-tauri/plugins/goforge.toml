# GoForge: Go in the style of GoLand. The logic lives in packs/goforge (lang-go: go.mod /
# go.work, test discovery, the Go Test provider, Go Build command lines, go:generate,
# go vet / golangci-lint reports; sdk: SDK detection and downloads, tools, module proxy;
# delve: the `go` debug adapter; pprof: profiles for the Profiler). gopls comes from the
# language server catalog (crates/forge-langservers).

[[plugin]]
id = "forge.go"
name = "Go"
version = "0.1.0"
pack = "goforge"
vendor = "Forge"
projectTypes = ["goforge"]
description = "Go SDK and GOPATH, go.mod / go.work, gofmt / goimports, go vet and golangci-lint, go generate, Go Build and Go Test (benchmarks, fuzzing, coverage), Delve debugging (launch, attach, remote) and the pprof Profiler."

[plugin.contributions]
languages = ["go"]

[[plugin.contributions.fileTypes]]
id = "go-mod"
name = "Go Module"
fileNames = ["go.mod"]
indentSize = 4

[[plugin.contributions.fileTypes]]
id = "go-work"
name = "Go Workspace"
fileNames = ["go.work"]
indentSize = 4

[[plugin.contributions.fileTypes]]
id = "go-sum"
name = "Go Checksums"
fileNames = ["go.sum", "go.work.sum"]

[[plugin.contributions.commands]]
id = "go.syncDependencies"
title = "Sync Dependencies (go mod tidy)"
category = "Go"

[[plugin.contributions.commands]]
id = "go.downloadDependencies"
title = "Download Dependencies (go mod download)"
category = "Go"

[[plugin.contributions.commands]]
id = "go.addDependency"
title = "Add Dependency…"
category = "Go"

[[plugin.contributions.commands]]
id = "go.vet"
title = "Run go vet"
category = "Go"

[[plugin.contributions.commands]]
id = "go.golangciLint"
title = "Run golangci-lint"
category = "Go"

[[plugin.contributions.commands]]
id = "go.generate"
title = "Run go generate for File"
category = "Go"

[[plugin.contributions.commands]]
id = "go.downloadSdk"
title = "Download Go SDK…"
category = "Go"

[[plugin.contributions.commands]]
id = "go.openProfile"
title = "Open Profile (pprof)…"
category = "Go"

[[plugin.contributions.runConfigurationTypes]]
id = "go-build"
name = "Go Build"
description = "Build a Go package, folder or files, and run the program (go run) or only build it (go build -o)."
icon = "box"
debuggable = true

[[plugin.contributions.runConfigurationTypes]]
id = "go-remote"
name = "Go Remote"
description = "Attach the debugger to a dlv --headless --accept-multiclient server, e.g. in a container or on another machine."
icon = "plug"
debuggable = true

# The Go Test provider (goforge_lang_go::provider) wraps this spec: discovery of tests,
# benchmarks, fuzz tests, examples and subtests, `go test -json` command lines, coverage
# and profiles are built in Rust.
[[plugin.contributions.testFrameworks]]
id = "go-test"
name = "Go Test"
description = "Run go test: all packages, a folder, a file, one test or subtest, or a name pattern; benchmarks and fuzzing; coverage and profiles."
icon = "flask-conical"
language = "go"
detect = { files = ["go.mod", "go.work", "*_test.go", "**/*_test.go"] }
testFiles = ["*_test.go"]
program = "go"
programSetting = "go.goroot"
report = "goTestJson"
debuggable = true
coverage = { args = [], file = "${coverageFile}", format = "goCover" }
rerun = { join = "|", template = "^(${names})$" }
fields = [
  { key = "kind", label = "Run", kind = "enum", default = "test", options = [
    { value = "test", label = "Tests" },
    { value = "bench", label = "Benchmarks" },
    { value = "fuzz", label = "Fuzzing" },
  ] },
  { key = "tags", label = "Build tags", placeholder = "integration,e2e" },
  { key = "count", label = "Count (-count)", placeholder = "1 disables the test cache" },
  { key = "benchtime", label = "Benchmark time", placeholder = "1s or 100x" },
  { key = "fuzztime", label = "Fuzz time", placeholder = "10s" },
  { key = "flags", label = "Go tool arguments", placeholder = "-race -v" },
  { key = "profile", label = "Profile", kind = "enum", default = "none", options = [
    { value = "none", label = "None" },
    { value = "cpu", label = "CPU (-cpuprofile)" },
    { value = "mem", label = "Memory (-memprofile)" },
    { value = "block", label = "Blocking (-blockprofile)" },
    { value = "mutex", label = "Mutex (-mutexprofile)" },
  ] },
]

[plugin.contributions.testFrameworks.scopes]
all = []
directory = ["${directory}"]
file = ["${file}"]
test = ["${file}", "${test}"]
pattern = ["${pattern}"]

# ---- Settings | Go -------------------------------------------------------------------

[[plugin.contributions.settings]]
key = "go.goroot"
