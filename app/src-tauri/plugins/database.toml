# ---- SQL inspections ---------------------------------------------------------------------

[[contributions.inspections]]
id = "SqlResolve"
name = "Unresolved reference"
group = "SQL"
language = "sql"
severity = "ERROR"
description = "Reports tables, columns, schemas and aliases that do not exist in the data source attached to the file or console, or in the script itself. Schemas that were not introspected are not checked."

[[contributions.inspections]]
id = "SqlAmbiguousColumn"
name = "Ambiguous column reference"
group = "SQL"
language = "sql"
severity = "WARNING"
description = "Reports unqualified columns that exist in more than one table of the query. The quick fix qualifies the column."

[[contributions.inspections]]
id = "SqlWithoutWhere"
name = "Delete or update statement without where clauses"
group = "SQL"
language = "sql"
severity = "WARNING"
description = "Reports DELETE and UPDATE statements without WHERE, which change every row of the table. The quick fix adds a WHERE placeholder."

[[contributions.inspections]]
id = "SqlUnusedAlias"
name = "Unused table alias"
group = "SQL"
language = "sql"
severity = "WEAK WARNING"
description = "Reports table aliases that no column of the query uses. The quick fix removes the alias."

[[contributions.inspections]]
id = "SqlUnusedCte"
name = "Unused common table expression"
group = "SQL"
language = "sql"
severity = "WARNING"
description = "Reports WITH queries that the statement never reads. The quick fix removes the CTE."

[[contributions.inspections]]
id = "SqlType"
name = "Types compatibility"
group = "SQL"
language = "sql"
severity = "WARNING"
description = "Reports comparisons of a column with a value of another type family (a number column with a string, a text column with a number) where the data source model knows the column's type. The quick fix quotes a number compared with a text column."

[[contributions.inspections]]
id = "SqlRedundantOrderingDirection"
name = "Redundant ordering direction"
group = "SQL/Redundant code"
language = "sql"
severity = "WEAK WARNING"
description = "Reports ASC in ORDER BY: ascending is the default. The quick fix removes it."

[[contributions.inspections]]
id = "SqlRedundantElseNull"
name = "Redundant ELSE NULL clause"
group = "SQL/Redundant code"
language = "sql"
severity = "WEAK WARNING"
description = "Reports ELSE NULL in CASE expressions: a CASE without ELSE gives NULL. The quick fix removes it."

[[contributions.inspections]]
id = "SqlRedundantAlias"
name = "Redundant alias expressions"
group = "SQL/Redundant code"
language = "sql"
severity = "WEAK WARNING"
description = "Reports aliases that repeat the table's or column's own name. The quick fix removes the alias."
