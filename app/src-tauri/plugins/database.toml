id = "forge.database"
name = "Database Tools and SQL"
version = "0.1.0"
pack = "core"
vendor = "Forge"
description = "Data sources, SQL consoles, schema browsing and table editing for MySQL, MariaDB, PostgreSQL, SQLite, SQL Server, ClickHouse and Oracle, plus Redis and MongoDB, with SSH tunnels, SSL, sessions and read-only / production data sources."

[[contributions.commands]]
id = "database.newDataSource"
title = "New Data Source…"
category = "Database"

[[contributions.commands]]
id = "database.openConsole"
title = "Open Query Console"
category = "Database"

[[contributions.toolWindows]]
id = "database"
title = "Database"
anchor = "right"
icon = "database"
order = 10

[[contributions.settings]]
key = "database.pageSize"
title = "Result set page size"
description = "Rows fetched per page in consoles and table editors."
type = "int"
min = 10
max = 100000
default = 500
group = "tools.database"
section = "Data Editor and Viewer"
order = 0

[[contributions.settings]]
key = "database.showNullAs"
title = "Show NULL as"
type = "string"
default = "<null>"
group = "tools.database"
section = "Data Editor and Viewer"
order = 10

[[contributions.settings]]
key = "database.suggestFromEnv"
title = "Suggest data sources from .env files"
description = "Offer to add the database configured in Laravel's DB_* or Symfony's DATABASE_URL."
type = "bool"
default = true
group = "tools.database"
section = "General"
order = 20

[[contributions.commands]]
id = "sql.runFile"
title = "Run SQL Script…"
category = "Database"

[[contributions.commands]]
id = "sql.queryHistory"
title = "Browse Query History"
category = "Database"

# ---- Settings | Languages & Frameworks | SQL Dialects ------------------------------------

[[contributions.settings]]
key = "sql.dialect.default"
title = "Global SQL dialect"
description = "Dialect of SQL files in every project unless the project or a path says otherwise."
type = "enum"
options = [
  { value = "generic", label = "Generic SQL" },
  { value = "mysql", label = "MySQL" },
  { value = "postgres", label = "PostgreSQL" },
  { value = "sqlite", label = "SQLite" },
  { value = "sqlserver", label = "SQL Server" },
  { value = "oracle", label = "Oracle" },
  { value = "clickhouse", label = "ClickHouse" },
]
default = "generic"
group = "lang.sqlDialects"
hidden = true
order = 0

[[contributions.settings]]
key = "sql.dialect.project"
title = "Project SQL dialect"
description = "Dialect of the project's SQL files; empty uses the global dialect."
type = "enum"
options = [
  { value = "", label = "<Global>" },
  { value = "generic", label = "Generic SQL" },
  { value = "mysql", label = "MySQL" },
  { value = "postgres", label = "PostgreSQL" },
  { value = "sqlite", label = "SQLite" },
  { value = "sqlserver", label = "SQL Server" },
  { value = "oracle", label = "Oracle" },
  { value = "clickhouse", label = "ClickHouse" },
]
default = ""
group = "lang.sqlDialects"
project = true
hidden = true
order = 1

[[contributions.settings]]
key = "sql.dialect.mappings"
title = "SQL dialect and data source mappings"
description = "Files and folders with their SQL dialect and the data source their names resolve against: path, dialect, dataSource. The most specific path wins."
type = "objects"
unique = ["path"]
default = []
group = "lang.sqlDialects"
project = true
hidden = true
order = 2

