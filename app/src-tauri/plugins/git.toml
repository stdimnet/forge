id = "forge.git"
name = "Git"
version = "0.1.0"
pack = "core"
vendor = "Forge"
description = "Commit, branches, log, diff and merge conflicts for Git repositories."

[[contributions.commands]]
id = "git.commit"
title = "Commit…"
category = "Git"

[[contributions.commands]]
id = "git.branches"
title = "Branches…"
category = "Git"

[[contributions.keybindings]]
command = "git.commit"
key = "Ctrl+K"

[[contributions.toolWindows]]
id = "commit"
title = "Commit"
anchor = "left"
icon = "git-commit-horizontal"
order = 10

[[contributions.toolWindows]]
id = "git"
title = "Git"
anchor = "bottom"
icon = "layers"
order = 60

[[contributions.settings]]
key = "vcs.git.path"
title = "Path to Git executable"
description = "Leave as `git` to use the one on PATH. Remote projects always use the git of their host."
type = "path"
default = "git"
group = "vcs.git"
order = 0

[[contributions.settings]]
key = "vcs.git.updateMethod"
title = "Update method"
description = "How Update Project (Ctrl+T) brings in remote changes. Branch default follows the branch's git configuration (pull.rebase)."
type = "enum"
options = [
  { value = "merge", label = "Merge" },
  { value = "rebase", label = "Rebase" },
  { value = "branchDefault", label = "Branch default" },
]
default = "merge"
group = "vcs.git"
order = 1

[[contributions.settings]]
key = "vcs.git.autoFetch"
title = "Fetch remotes automatically"
description = "In the background, for repositories whose branch has an upstream. Failures are ignored."
type = "bool"
default = true
group = "vcs.git"
order = 2

[[contributions.settings]]
key = "vcs.git.autoFetchInterval"
title = "Fetch every (minutes)"
type = "int"
min = 1
max = 240
default = 10
group = "vcs.git"
order = 3

[[contributions.settings]]
key = "vcs.git.inlineBlame"
title = "Show inline blame"
description = "At the end of the line with the caret: who last changed it, when, and the commit message. Annotate with Git Blame works either way."
type = "bool"
default = true
group = "vcs.git"
order = 4

[[contributions.settings]]
key = "vcs.git.branches.groupByDirectory"
title = "Group branches by directory"
description = "In the Branches popup and the Git tool window: branches whose names contain a slash are shown in folders (feat/ui/tabs in feat > ui). Search still finds branches in collapsed folders."
type = "bool"
default = true
group = "vcs.git"
order = 5

[[contributions.settings]]
key = "vcs.git.commit.subjectMaxLength"
title = "Limit subject line length"
type = "int"
min = 20
max = 200
default = 72
group = "vcs.git"
section = "Commit Message Inspections"
order = 10

[[contributions.settings]]
key = "vcs.git.commit.blankLineAfterSubject"
title = "Require blank line between subject and body"
type = "bool"
default = true
group = "vcs.git"
section = "Commit Message Inspections"
order = 11

[[contributions.settings]]
key = "vcs.git.commit.bodyRightMargin"
title = "Right margin for body (columns)"
type = "int"
min = 40
max = 200
default = 72
group = "vcs.git"
section = "Commit Message Inspections"
order = 12

[[contributions.settings]]
key = "vcs.git.commit.warnOnCrlf"
title = "Warn if CRLF line separators are about to be committed"
type = "bool"
default = true
group = "vcs.git"
section = "Commit"
order = 20

[[contributions.settings]]
key = "vcs.git.commit.signOff"
title = "Sign-off commits"
type = "bool"
default = false
group = "vcs.git"
section = "Commit"
order = 21

[[contributions.settings]]
key = "vcs.git.commit.gpgSign"
title = "Sign commits with GPG/SSH key"
description = "Commits from Forge are signed (`git commit -S`) with the key chosen in Configure GPG Key…, or the one in git config (`user.signingkey`). Forge never changes git config."
type = "bool"
default = false
project = true
group = "vcs.git"
section = "Commit"
order = 23

[[contributions.settings]]
key = "vcs.git.commit.signingKey"
title = "Signing key"
description = "`openpgp:<key id>` or `ssh:<public key file>`; empty uses `user.signingkey` from git config."
type = "string"
default = ""
project = true
hidden = true
group = "vcs.git"
section = "Commit"
order = 24

[[contributions.settings]]
key = "vcs.git.cherryPickSuffix"
title = "Add the 'cherry-picked from <hash>' suffix when picking commits pushed to protected branches"
type = "bool"
default = true
group = "vcs.git"
section = "Commit"
order = 22

[[contributions.settings]]
key = "vcs.git.protectedBranches"
title = "Protected branches"
description = "Branch names or patterns (`*` wildcards) separated by `;`. Log actions never rewrite commits that are already pushed to them."
type = "string"
default = "master;main"
group = "vcs.git"
section = "Push"
order = 30

[[contributions.settings]]
key = "vcs.changelists.createAutomatically"
title = "Create changelists automatically"
description = "Apply Patch and Unshelve put the changes into a new changelist named after the patch or the shelved changes."
type = "bool"
default = true
group = "vcs.changelists"
order = 0

[[contributions.settings]]
key = "vcs.commit.reformat"
title = "Reformat code"
description = "Reformat the committed files with the code style before committing."
type = "bool"
default = false
group = "vcs.commit"
section = "Commit Checks"
order = 0

[[contributions.settings]]
key = "vcs.commit.rearrange"
title = "Rearrange code"
type = "bool"
default = false
group = "vcs.commit"
section = "Commit Checks"
order = 1

[[contributions.settings]]
key = "vcs.commit.optimizeImports"
title = "Optimize imports"
type = "bool"
default = false
group = "vcs.commit"
section = "Commit Checks"
order = 2

[[contributions.settings]]
key = "vcs.commit.analyze"
title = "Analyze code"
description = "Run the inspections on the committed files; errors and warnings ask Review or Commit Anyway."
type = "bool"
default = false
group = "vcs.commit"
section = "Commit Checks"
order = 3

[[contributions.settings]]
key = "vcs.commit.checkTodo"
title = "Check TODO"
description = "Look for TODO items (Settings | Editor | TODO patterns) in the changed lines."
type = "bool"
default = false
group = "vcs.commit"
section = "Commit Checks"
order = 4

[[contributions.settings]]
key = "vcs.commit.cleanup"
title = "Cleanup"
description = "Run code cleanup on the committed files."
type = "bool"
default = false
group = "vcs.commit"
section = "Commit Checks"
order = 5

[[contributions.settings]]
key = "vcs.commit.runTests"
title = "Run Tests"
description = "Run the chosen run configuration before committing; failing tests ask Review or Commit Anyway."
type = "bool"
default = false
group = "vcs.commit"
section = "Advanced Commit Checks"
order = 10

[[contributions.settings]]
key = "vcs.commit.testConfiguration"
title = "Run configuration for Run Tests"
type = "string"
default = ""
group = "vcs.commit"
section = "Advanced Commit Checks"
order = 11

[[contributions.settings]]
key = "vcs.commit.runHooks"
title = "Run Git hooks"
description = "Unchecked commits with --no-verify (pre-commit and commit-msg hooks are skipped)."
type = "bool"
default = true
group = "vcs.commit"
section = "Git"
order = 20

[[contributions.settings]]
key = "vcs.commit.messageHistorySize"
title = "Commit message history size"
description = "How many commit messages Commit Message History (Ctrl+M) keeps for each project."
type = "int"
min = 1
max = 500
default = 20
group = "vcs.commit"
section = "Commit Message"
order = 30
