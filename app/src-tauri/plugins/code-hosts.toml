id = "forge.code-hosts"
name = "GitLab, Forgejo, GitHub and Azure DevOps"
version = "0.1.0"
pack = "core"
vendor = "Forge"
description = "Merge and pull requests, code review, issues and CI pipelines for GitLab, Forgejo/Gitea, GitHub and Azure DevOps (work items as issues, builds as pipelines)."
depends = ["forge.git"]

[[contributions.commands]]
id = "forges.createMergeRequest"
title = "Create Merge Request…"
category = "Git"

[[contributions.commands]]
id = "forges.showMergeRequests"
title = "View Pull/Merge Requests"
category = "Git"

[[contributions.toolWindows]]
id = "pull-requests"
title = "Pull Requests"
anchor = "left"
icon = "git-pull-request"
order = 20

[[contributions.settings]]
key = "vcs.hosts.statusBarPipeline"
title = "Show the CI status of the current branch in the status bar"
type = "bool"
default = true
group = "vcs.hosts"
section = "General"
order = 0

[[contributions.settings]]
key = "vcs.hosts.refreshSeconds"
title = "Refresh merge requests and pipelines every (seconds)"
description = "0 turns automatic refresh off."
type = "int"
min = 0
max = 3600
default = 120
group = "vcs.hosts"
section = "General"
order = 1
