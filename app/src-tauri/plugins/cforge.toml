# CForge: C and C++ in the style of CLion. The logic lives in packs/cforge
# (cforge-toolchains: GCC / Clang / MSVC / MinGW / cross toolchains with their build tools
# and debuggers; cforge-cmake: profiles, presets, the cmake-file-api model, configure logs,
# command lines, CMakeLists completion; cforge-lang-cpp: build problems, compilation
# databases, GoogleTest / Catch2 / CTest, coverage, clangd / clang-format command lines and
# debugger setup). clangd is downloaded on request by forge-langservers (managed::clangd) and
# started by app/src-tauri/src/commands/cpp.rs; debugging uses the LLDB and GDB adapters of
# forge.debugger. CForge v2: cforge-analyzers (sanitizer reports, Valgrind XML, perf script)
# and cforge-embedded (platformio.ini, idf.py, west, OpenOCD, CMSIS-SVD), wired up by
# commands/cpp_tools.rs and commands/embedded.rs.

id = "forge.cpp"
name = "C/C++"
version = "0.1.0"
pack = "cforge"
vendor = "Forge"
description = "C and C++ with CMake and compilation databases: clangd (with clang-tidy), clang-format, toolchains (GCC, Clang, MSVC, MinGW, cross compilers), CMake profiles and presets with the CMake tool window, Build / Rebuild / Clean with build problems, CMake Application configurations, CTest, GoogleTest and Catch2 with coverage, LLDB / GDB debugging with STL renderers, sanitizers, Valgrind Memcheck, perf profiling, vcpkg and Conan, and embedded development: PlatformIO, ESP-IDF, Zephyr, OpenOCD and the SVD Peripherals view."
projectTypes = ["cforge"]
depends = ["forge.debugger"]

[contributions]
languages = ["c", "cpp"]

