# ---- CTest, GoogleTest and Catch2 on the shared test runner (forge-testing) ---------------
# The run configuration types and their test files; discovery (TEST / TEST_F / TEST_P,
# TEST_CASE / SECTION), command lines (--gtest_filter, Catch2 test specs, ctest -R), JUnit
# reports, Rerun Failed Tests and gcov / llvm-cov coverage come from
# `cforge_lang_cpp::CppTests`, registered under the same ids.

[[contributions.testFrameworks]]
id = "gtest"
name = "Google Test"
description = "Run GoogleTest tests of a CMake target: all, a file, a suite or one test (--gtest_filter), with gcov / llvm-cov coverage."
icon = "flask-conical"
language = "cpp"
detect = { files = ["CMakeLists.txt"], dependencies = [{ file = "CMakeLists.txt", contains = "GTest" }, { file = "CMakeLists.txt", contains = "gtest" }, { file = "CMakeLists.txt", contains = "googletest" }] }
testFiles = ["*.cpp", "*.cc", "*.cxx"]
report = "jUnitFile"
debuggable = true
fields = [
  { key = "target", label = "Target", placeholder = "Empty: the CMake target that compiles the file" },
  { key = "executable", label = "Executable", placeholder = "Empty: the target's executable" },
  { key = "filter", label = "Test filter (--gtest_filter)", placeholder = "PolygonTest.*:-*Slow*" },
]

[contributions.testFrameworks.scopes]
all = []
file = ["${file}"]
test = ["${test}"]
pattern = ["${pattern}"]

[[contributions.testFrameworks]]
id = "catch2"
name = "Catch2"
description = "Run Catch2 test cases and sections of a CMake target, by name, tag or test spec, with gcov / llvm-cov coverage."
icon = "flask-conical"
language = "cpp"
detect = { dependencies = [{ file = "CMakeLists.txt", contains = "Catch2" }, { file = "CMakeLists.txt", contains = "catch2" }] }
testFiles = ["*.cpp", "*.cc", "*.cxx"]
report = "jUnitFile"
debuggable = true
fields = [
  { key = "target", label = "Target", placeholder = "Empty: the CMake target that compiles the file" },
  { key = "executable", label = "Executable", placeholder = "Empty: the target's executable" },
  { key = "filter", label = "Test spec", placeholder = "[math]~[slow]" },
]

[contributions.testFrameworks.scopes]
all = []
file = ["${file}"]
test = ["${test}"]
pattern = ["${pattern}"]

[[contributions.testFrameworks]]
id = "ctest"
name = "CTest"
description = "Run the tests CMake's add_test, gtest_discover_tests or catch_discover_tests register (ctest --output-junit), all or by name, label or regular expression."
icon = "flask-conical"
language = "cpp"
detect = { dependencies = [{ file = "CMakeLists.txt", contains = "enable_testing" }, { file = "CMakeLists.txt", contains = "include(CTest)" }] }
testFiles = []
report = "jUnitFile"
debuggable = false
fields = [
  { key = "filter", label = "Tests (-R regular expression)", placeholder = "^shapes\\." },
  { key = "label", label = "Label (-L)" },
  { key = "jobs", label = "Parallel jobs (-j)", placeholder = "4" },
]

[contributions.testFrameworks.scopes]
all = []
test = ["${test}"]
pattern = ["${pattern}"]

