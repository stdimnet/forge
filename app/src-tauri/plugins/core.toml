description = "Where the navigation bar (project, folders, file and members at the caret) is shown: Top: above the editor, with the path in the status bar too. In status bar: only in the status bar. Don't show: Jump to Navigation Bar (Alt+Home) shows it as a popup. View | Appearance | Navigation Bar."
type = "enum"
options = [
  { value = "top", label = "Top" },
  { value = "statusBar", label = "In status bar" },
  { value = "hidden", label = "Don't show" },
]
