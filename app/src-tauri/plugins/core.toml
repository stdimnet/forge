# ---- Languages & Frameworks > Template Data Languages --------------------------------

[[contributions.settings]]
key = "templates.dataLanguages"
title = "Template data languages"
description = "Language of the content between template tags, one entry per pattern: `legacy/latex/*.tpl=latex`, `*.mail.twig=text`. Languages: html, xml, latex, css, scss, less, javascript, typescript, json, sql, yaml, ini, shell, text. Compound names like `invoice.tex.twig` are detected automatically. Applies to files opened afterwards."
type = "list"
default = []
group = "lang.templates"
section = "Data Languages"
project = true
order = 0

[[contributions.settings]]
key = "templates.delimiters"
title = "Template delimiters"
description = "Delimiters of a template language in a data language, e.g. Smarty in LaTeX, where `{` is part of the content. Templates without an entry use the language's default delimiters. Applies to open editors."
type = "objects"
unique = ["template", "language"]
default = [
  { template = "smarty", language = "latex", left = "[[", right = "]]" },
  { template = "twig", language = "latex", variableStart = '\VAR{', variableEnd = "}", blockStart = '\BLOCK{', blockEnd = "}", commentStart = '\#{', commentEnd = "}" },
  { template = "jinja", language = "latex", variableStart = '\VAR{', variableEnd = "}", blockStart = '\BLOCK{', blockEnd = "}", commentStart = '\#{', commentEnd = "}" },
]
group = "lang.templates"
section = "Delimiters"
project = true
order = 10

[[contributions.settings]]
key = "fileTemplates.custom"
title = "File and code templates"
description = "Templates added in Settings | Editor | File and Code Templates and the changed text of built-in ones (kind \"file\", \"include\" or \"code\", name, extension, text). Built-in templates without an entry use their default text."
type = "objects"
unique = ["kind", "name"]
default = []
group = "editor.file-templates"
order = 0

