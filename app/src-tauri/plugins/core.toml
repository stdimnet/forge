options = [
  { value = "auto", label = "Match the system" },
  { value = "windows", label = "Windows" },
  { value = "macos", label = "macOS" },
  { value = "gnome", label = "GNOME" },
  { value = "kde", label = "KDE Plasma" },
  { value = "linux", label = "Generic Linux" },
  { value = "native", label = "Native title bar" },
]
default = "auto"
group = "appearance"
section = "Window"
