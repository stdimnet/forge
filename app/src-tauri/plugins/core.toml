# The IDE platform itself: appearance, system and editor settings.
id = "forge.core"
name = "Forge Platform"
version = "0.1.0"
pack = "core"
vendor = "Forge"
required = true
description = "Workbench, editor, settings and the plugin system."

[[contributions.commands]]
id = "settings.open"
title = "Settings…"
category = "File"

[[contributions.commands]]
id = "file.saveAll"
title = "Save All"
category = "File"

[[contributions.keybindings]]
command = "settings.open"
key = "Ctrl+Alt+S"

[[contributions.keybindings]]
command = "settings.open"
key = "Meta+,"
keymap = "macos"

[[contributions.keybindings]]
command = "file.saveAll"
key = "Ctrl+S"

[[contributions.toolWindows]]
id = "project"
title = "Project"
anchor = "left"
icon = "folder"

# ---- Keymap (edited on the Keymap page) ------------------------------------------------

[[contributions.settings]]
key = "keymap.active"
title = "Keymap"
type = "enum"
options = [
  { value = "auto", label = "Platform default" },
  { value = "$default", label = "Windows / Linux" },
  { value = "macOS", label = "macOS" },
]
default = "auto"
group = "keymap"
order = 0

[[contributions.settings]]
key = "keymap.overrides.default"
title = "Changed shortcuts (Windows / Linux)"
description = "One entry per action: the action id, then its shortcuts, separated by tabs."
type = "list"
default = []
group = "keymap"
order = 1

[[contributions.settings]]
key = "keymap.overrides.macOS"
title = "Changed shortcuts (macOS)"
description = "One entry per action: the action id, then its shortcuts, separated by tabs."
type = "list"
default = []
group = "keymap"
order = 2

