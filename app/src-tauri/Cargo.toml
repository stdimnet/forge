dotnetforge-gamedev.workspace = true
pyforge-testing.workspace = true
pyforge-frameworks.workspace = true
pyforge-jupyter = { workspace = true, features = ["runtime", "keychain"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
dirs.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Forwards `forge file:12` and forge:// links from a second launch to the running window.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
tempfile.workspace = true
