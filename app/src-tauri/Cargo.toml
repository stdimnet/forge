[package]
name = "forge-app"
description = "Forge IDE desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "forge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "forge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
forge-core.workspace = true
forge-bookmarks.workspace = true
forge-plugin-api.workspace = true
forge-fuzzy.workspace = true
forge-filetypes.workspace = true
forge-text.workspace = true
forge-save-actions = { workspace = true, features = ["backend"] }
forge-editing.workspace = true
forge-file-templates.workspace = true
forge-ai.workspace = true
futures-util = "0.3"
forge-agent-cli.workspace = true
forge-lsp.workspace = true
forge-langservers.workspace = true
forge-vcs.workspace = true
forge-forges.workspace = true
forge-project.workspace = true
forge-open.workspace = true
forge-process.workspace = true
forge-markdown.workspace = true
forge-viewers.workspace = true
forge-debug.workspace = true
forge-db.workspace = true
forge-containers.workspace = true
forge-keymap.workspace = true
forge-livetemplates.workspace = true
forge-injections.workspace = true
forge-emmet.workspace = true
forge-colors.workspace = true
forge-spell.workspace = true
forge-jsonschema = { workspace = true, features = ["remote"] }
forge-scratches = { workspace = true, features = ["client"] }
forge-backend = { workspace = true, features = ["search"] }
forge-remote.workspace = true
forge-window.workspace = true
forge-update.workspace = true
phpforge-lang-php = { path = "../../packs/phpforge/lang-php" }
phpforge-fw-laravel = { path = "../../packs/phpforge/fw-laravel" }
phpforge-fw-symfony = { path = "../../packs/phpforge/fw-symfony" }
phpforge-orm-doctrine = { path = "../../packs/phpforge/orm-doctrine" }
phpforge-dql = { path = "../../packs/phpforge/dql" }
webforge-lang-web = { path = "../../packs/webforge/lang-web" }
luaforge-lang-lua.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Forwards `forge file:12` and forge:// links from a second launch to the running window.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
tempfile.workspace = true
