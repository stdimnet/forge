[package]
name = "forge-app"
description = "Forge IDE desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "forge_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "forge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
forge-core.workspace = true
forge-plugin-api.workspace = true
forge-ai.workspace = true
futures-util = "0.3"
forge-agent-cli.workspace = true
forge-lsp.workspace = true
forge-vcs.workspace = true
forge-project.workspace = true
forge-open.workspace = true
phpforge-lang-php = { path = "../../packs/phpforge/lang-php" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Forwards `forge file:12` and forge:// links from a second launch to the running window.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
